<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — My Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Change my password"></header>

  <form id="form">
    <label for="current">Current password</label>
    <input id="current" type="password" autocomplete="current-password" required>
    <label for="next">New password</label>
    <input id="next" type="password" autocomplete="new-password" minlength="6" required>
    <label for="confirm">Type the new password again</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="6" required>
    <button class="primary" type="submit">Change password</button>
  </form>
  <div id="message" class="message"></div>

  <nav class="tabbar" data-active="more"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin();
    const form = document.getElementById('form');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (form.next.value !== form.confirm.value) {
        showMessage(messageEl, "The two new passwords don't match.");
        return;
      }
      try {
        await whileBusy(form.querySelector('button'), 'Saving…', () =>
          api('changePassword', { currentPassword: form.current.value, newPassword: form.next.value }));
        form.reset();
        showMessage(messageEl, 'Password changed.', 'ok');
      } catch (err) {
        showMessage(messageEl, err.message);
      }
    });
  </script>
</body>
</html>
