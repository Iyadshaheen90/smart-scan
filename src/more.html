<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — More</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="More"></header>
  <p class="sub" id="who"></p>

  <a class="list-card owner-only hidden" href="users.html"><span class="icon-box" data-icon="users"></span><span class="grow">Manage Employees</span><span class="chev" data-icon="chevronRight"></span></a>
  <!-- Owner, or an employee with Ticket order: set every slot to descending or ascending at once. -->
  <button type="button" class="list-card hidden" id="orderRow"><span class="icon-box" data-icon="order"></span><span class="grow">Ticket Order</span><span class="chev" data-icon="chevronRight"></span></button>
  <div id="orderResult" class="message"></div>
  <a class="list-card" href="raw-scanner.html"><span class="icon-box" data-icon="scan"></span><span class="grow">Scanner Test</span><span class="chev" data-icon="chevronRight"></span></a>
  <a class="list-card" href="account.html"><span class="icon-box" data-icon="key"></span><span class="grow">Change My Password</span><span class="chev" data-icon="chevronRight"></span></a>
  <button type="button" class="list-card danger" id="signOut"><span class="icon-box" data-icon="logout"></span><span class="grow">Sign Out</span></button>

  <div id="orderDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="orderTitle">
    <div class="dialog">
      <div class="dialog-title" id="orderTitle">Ticket Order for All Slots</div>
      <div class="slot-detail">Empty slots switch now. A slot with a pack keeps counting that pack its way and switches when it sells out or is returned.</div>
      <div class="reasons" id="orderChoices">
        <button type="button" data-order="descending"><span class="order-icon" data-icon="arrowDown"></span> All Descending</button>
        <button type="button" data-order="ascending"><span class="order-icon" data-icon="arrowUp"></span> All Ascending</button>
      </div>
      <div id="orderError" class="message"></div>
      <div class="dialog-buttons">
        <button type="button" class="cancel" id="orderCancel">Cancel</button>
        <button type="button" class="save" id="orderSave" disabled>Save</button>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-active="more"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin();
    if (session) {
      document.getElementById('who').textContent = `Signed in as ${session.username} (${session.role}).`;
      if (session.role === 'owner') document.querySelectorAll('.owner-only').forEach((el) => el.classList.remove('hidden'));
    }
    document.getElementById('signOut').addEventListener('click', () => signOut());

    // Ticket order for every slot (setAllSlotsOrder): pick one, then Save; Cancel changes nothing.
    const $ = (id) => document.getElementById(id);
    let chosenOrder = null;
    if (session && can(session, 'ticket_order')) $('orderRow').classList.remove('hidden');
    function pickOrder(order) {
      chosenOrder = order;
      document.querySelectorAll('#orderChoices button').forEach((b) => b.classList.toggle('active', b.dataset.order === order));
      $('orderSave').disabled = !order;
    }
    $('orderRow').addEventListener('click', () => {
      pickOrder(null);
      $('orderError').className = 'message';
      $('orderError').textContent = '';
      $('orderDialog').classList.remove('hidden');
    });
    document.querySelectorAll('#orderChoices button').forEach((b) => b.addEventListener('click', () => pickOrder(b.dataset.order)));
    $('orderCancel').addEventListener('click', () => $('orderDialog').classList.add('hidden'));
    $('orderSave').addEventListener('click', async () => {
      try {
        const result = await whileBusy($('orderSave'), 'Saving…', () => api('setAllSlotsOrder', { order: chosenOrder }));
        $('orderDialog').classList.add('hidden');
        const word = result.order === 'ascending' ? '↑ ascending' : '↓ descending';
        showMessage($('orderResult'), `All ${result.slots} slots are set to ${word}. ${result.nowSlots} switched now`
          + (result.waitingSlots ? `; ${result.waitingSlots} switch when their pack sells out or is returned.` : '.'), 'ok');
      } catch (err) {
        showMessage($('orderError'), err.message);
      }
    });
  </script>
</body>
</html>
