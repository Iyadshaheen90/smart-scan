<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Choose a Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Opened from an invite email (a new employee) or a Forgot Password email (database backend only). The link's
       address carries a one-time sign-in; the person chooses a password and is signed in. -->
  <header class="app-header" data-title="Choose a Password"></header>
  <p id="intro" class="sub">Choose a password for Smart Scan.</p>

  <form id="form" class="auth-card hidden">
    <label for="password">New Password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <ul class="password-rule"></ul>
    <label for="confirm">Type the Password Again</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <button class="primary" type="submit">Save Password</button>
  </form>
  <div id="message" class="message"></div>
  <p id="appNote" class="sub hidden" style="margin-top: 20px;">Using Smart Scan from your home screen? Open it and sign in there with your email and this password.</p>
  <a id="continue" class="button primary hidden" href="index.html">Continue</a>
  <p id="signInLine" class="sub hidden" style="margin-top: 20px;"><a href="login.html">Go to Sign In</a></p>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    // Set when this page switched the browser to the database just to use an email link.
    const LINK_SWITCH_KEY = 'smartScanLinkSwitch';
    const form = document.getElementById('form');
    const messageEl = document.getElementById('message');
    document.querySelectorAll('.password-rule').forEach((el) => showPasswordRule(el));

    // The link's sign-in is after the # (Supabase Auth's redirect); an expired or used link says so there instead.
    const link = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    // Only the database sends these emails. Before the cutover the link opens in a browser that's still on Sheets
    // (an iPhone opens it in Safari, not the home-screen app), so that browser switches to the database first and the
    // page opens again with the link still in the address (api.js PHONE_ON_DATABASE).
    if (!USE_DATABASE && PHONE_SWITCH_OFFERED && (link.get('access_token') || link.get('error'))) {
      let saved = false;
      try {
        localStorage.setItem(PHONE_BACKEND_KEY, 'database');
        saved = localStorage.getItem(PHONE_BACKEND_KEY) === 'database';
      } catch (e) {}
      // Never reloads over and over: only once the switch is really saved.
      if (saved) {
        try { sessionStorage.setItem(LINK_SWITCH_KEY, '1'); } catch (e) {}
        location.reload();
        throw new Error('switching to the database');
      }
    }
    // That switch is for this page only (found 2026-11-12): an employee who opens their invite before the cutover must
    // not be left on the database, where their shift closes and activations would go into practice data instead of the
    // sheets (an Android home-screen app shares its storage with the browser). This page already runs on the database,
    // so the switch is taken back at once: the next page opened is on Sheets again, with its Sheets sign-in untouched.
    let linkOnly = false;
    try {
      linkOnly = sessionStorage.getItem(LINK_SWITCH_KEY) === '1';
      sessionStorage.removeItem(LINK_SWITCH_KEY);
      if (linkOnly) localStorage.removeItem(PHONE_BACKEND_KEY);
    } catch (e) {}
    // Take it out of the address, so it isn't left in the history or shared by mistake.
    history.replaceState(null, '', location.pathname);
    const tokens = link.get('access_token') && link.get('refresh_token') ? {
      access_token: link.get('access_token'),
      refresh_token: link.get('refresh_token'),
      expires_in: Number(link.get('expires_in')) || 3600,
    } : null;

    if (!tokens) {
      showMessage(messageEl, link.get('error')
        ? 'This link has expired or was already used. Ask the owner for a new one, or use Forgot Password on the sign-in page.'
        : 'Open this page from the link in your email.');
      document.getElementById('signInLine').classList.remove('hidden');
    } else {
      document.getElementById('intro').textContent = link.get('type') === 'invite'
        ? 'Welcome to Smart Scan. Choose the password you will sign in with.'
        : 'Choose a new password for Smart Scan.';
      form.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (form.password.value !== form.confirm.value) {
        showMessage(messageEl, "The two passwords don't match.");
        return;
      }
      if (passwordProblem(form.password.value)) {
        showMessage(messageEl, passwordProblem(form.password.value));
        return;
      }
      try {
        const session = await whileBusy(form.querySelector('button[type="submit"]'), 'Saving…', () =>
          api('setNewPassword', { tokens, password: form.password.value }));
        form.classList.add('hidden');
        // Sign In fills it in next time (once this phone is on the database).
        rememberEmail(session.email);
        if (linkOnly) {
          // Before the cutover: the password is saved, but this phone keeps working on Sheets (no database sign-in is
          // kept, so the Sheets one isn't replaced).
          showMessage(messageEl, `Password saved for ${session.username}. Keep signing in to Smart Scan the way you do today. `
            + 'The owner will tell you when to start signing in with your email and this password.', 'ok');
          return;
        }
        saveSession(session);
        showMessage(messageEl, `Password saved. You're signed in as ${session.username}.`, 'ok');
        document.getElementById('appNote').classList.remove('hidden');
        document.getElementById('continue').classList.remove('hidden');
      } catch (err) {
        showMessage(messageEl, err.message);
      }
    });
  </script>
</body>
</html>
