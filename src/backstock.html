<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Back Stock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Back stock"></header>

  <label for="search">Find a game</label>
  <input id="search" type="search" inputmode="numeric" autocomplete="off" placeholder="Game number, e.g. 1747">
  <div id="searchResults"></div>
  <div id="searchMessage" class="message" style="margin-bottom: 14px;"></div>

  <div class="segmented" id="modeSwitch">
    <button type="button" data-mode="shipment">Shipment received</button>
    <button type="button" data-mode="count">Count the back</button>
  </div>
  <p class="sub" id="modeHint"></p>

  <div class="scan-viewport paused" id="viewport">
    <video id="video" playsinline muted autoplay></video>
    <div class="scan-guide"></div>
  </div>
  <button type="button" class="hold-button" id="holdBtn">Press and hold to scan</button>
  <form id="typedForm">
    <label for="typed">Or type a ticket number, or just the 4-digit game number</label>
    <input id="typed" inputmode="numeric" autocomplete="off" placeholder="1747-1263622-4-075 or 1747">
    <button type="submit">Add game</button>
  </form>
  <div id="flash" class="message"></div>

  <div id="lines"></div>
  <div id="saveArea" class="hidden">
    <label for="notes">Notes (optional)</label>
    <input id="notes" autocomplete="off" placeholder="e.g. invoice number">
    <button type="button" class="primary" id="saveBtn">Save</button>
    <button type="button" id="clearBtn">Clear list</button>
  </div>
  <div id="saveMessage" class="message"></div>

  <h2>In the back now</h2>
  <p class="sub saved-dim" id="totals"></p>
  <div id="stock" class="saved-dim saved-lock">Loading…</div>
  <div id="stockMessage" class="message"></div>

  <!-- Games CA Lottery has stopped, hidden from the list above. -->
  <details id="endedBox" class="hidden saved-dim saved-lock" style="margin-top: 18px;">
    <summary id="endedTitle"></summary>
    <p class="sub">Hidden from back stock. Receiving a pack of one, or putting one in a slot, brings it back by itself.</p>
    <div id="ended"></div>
  </details>

  <!-- Manage packs: + / − the packs of one game in the back, then Save. More packs are saved at once
       (as a shipment); fewer first asks why, and nothing changes until a reason is tapped. -->
  <div id="packDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="packTitle">
    <div class="dialog">
      <div class="dialog-title" id="packTitle"></div>
      <div id="packCountStep">
        <div class="slot-detail">Packs in the back</div>
        <div class="stepper">
          <button type="button" id="packMinus" aria-label="One pack less">−</button>
          <div class="stepper-count" id="packCount"></div>
          <button type="button" id="packPlus" aria-label="One pack more">+</button>
        </div>
        <div class="slot-detail" id="packChange"></div>
        <div class="dialog-buttons">
          <button type="button" class="cancel" id="packCancel">Cancel</button>
          <button type="button" class="save" id="packSave">Save</button>
        </div>
      </div>
      <div id="packReasonStep" class="hidden">
        <div class="dialog-label" id="packReasonTitle"></div>
        <div class="reasons" id="removeReasons">
          <button type="button" data-reason="returned">Returned</button>
          <button type="button" data-reason="game expired">Game expired</button>
          <button type="button" data-reason="damaged">Damaged</button>
          <button type="button" data-reason="stolen">Stolen</button>
          <button type="button" data-reason="other">Other</button>
        </div>
        <div class="dialog-buttons">
          <button type="button" class="cancel" id="reasonCancel">Cancel</button>
          <button type="button" id="reasonBack">Back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shipment received: scanning (or typing) a game opens this. It starts at 1 pack received; Save adds
       them to what's in the back at once (a delivery). A new game also needs its price and pack size. -->
  <div id="shipDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="shipTitle">
    <div class="dialog">
      <div class="dialog-title" id="shipTitle"></div>
      <div class="slot-detail" id="shipInfo"></div>
      <div id="shipNewGame" class="hidden" style="text-align: left;">
        <label for="shipPrice">Price per ticket ($)</label>
        <input id="shipPrice" type="number" min="0" step="1" inputmode="decimal" autocomplete="off">
        <label for="shipSize">Tickets per pack</label>
        <input id="shipSize" type="number" min="1" step="1" inputmode="numeric" autocomplete="off">
      </div>
      <div class="slot-detail">Packs received</div>
      <div class="stepper">
        <button type="button" id="shipMinus" aria-label="One pack less">−</button>
        <div class="stepper-count" id="shipCount"></div>
        <button type="button" id="shipPlus" aria-label="One pack more">+</button>
      </div>
      <div class="slot-detail" id="shipChange"></div>
      <div class="dialog-buttons">
        <button type="button" class="cancel" id="shipCancel">Cancel</button>
        <button type="button" class="save" id="shipSave">Save</button>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-active="stock"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script src="barcode.js"></script>
  <script type="module">
    import { startScanner } from './scanner.js';

    // Scan one ticket from each game, type how many packs, and save the whole list at once.
    // The list is kept on this phone until saved.

    const session = requireLogin('owner');
    const $ = (id) => document.getElementById(id);
    const money = (n) => `$${Number(n).toLocaleString()}`;
    const DRAFT_KEY = 'smartScanBackStockDraft';
    const HINTS = {
      shipment: 'Scan one ticket from each game in the delivery, then tap + for how many packs came and Save. They are added to what is in the back.',
      count: 'Scan one ticket from each game on the shelf and enter how many packs you counted. That becomes the number in the back; any difference is logged. Games you don\'t scan are left as they are.',
    };

    let mode = 'shipment';
    let lines = [];      // { gameNumber, packs, gamePrice?, ticketsPerPack? }
    let stock = [];      // from listBackStock
    let stockLoaded = false;


    // --- Draft ---
    function saveDraft() {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ mode, lines, notes: $('notes').value })); } catch (e) {}
    }
    function loadDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        if (draft) {
          mode = draft.mode === 'count' ? 'count' : 'shipment';
          lines = Array.isArray(draft.lines) ? draft.lines : [];
          $('notes').value = draft.notes || '';
        }
      } catch (e) {}
    }

    const known = (gameNumber) => stock.find((g) => g.gameNumber === gameNumber);
    const active = () => stock.filter((g) => !g.endedDate);
    const ended = () => stock.filter((g) => g.endedDate);

    function flash(text, kind = 'ok') { showMessage($('flash'), text, kind); }

    function addGame(gameNumber) {
      if (mode === 'shipment') {
        if (!stockLoaded) { flash('Still loading back stock. Try again in a moment.', 'error'); return; }
        whenHandsFree(() => openShipDialog(gameNumber));
        return;
      }
      const existing = lines.find((l) => l.gameNumber === gameNumber);
      if (existing) {
        flash(`Game ${gameNumber} is already on the list — change its number of packs below.`);
        focusLine(gameNumber);
        return;
      }
      const game = known(gameNumber);
      const line = { gameNumber, packs: mode === 'count' && game ? game.packsInBack : '' };
      lines.unshift(line);
      saveDraft();
      render();
      flash(game ? `Game ${gameNumber} ($${game.price}) added. Enter the packs.` : `Game ${gameNumber} is new — enter its price and the packs.`);
      focusLine(gameNumber);
    }

    function focusLine(gameNumber) {
      const input = document.querySelector(`[data-game="${gameNumber}"] input.packs`);
      if (input) { input.focus(); input.select(); }
    }

    // --- Drawing ---

    function render() {
      document.querySelectorAll('#modeSwitch button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
      $('modeHint').textContent = HINTS[mode];

      const list = $('lines');
      list.innerHTML = '';
      for (const line of lines) list.append(lineCard(line));
      $('saveArea').classList.toggle('hidden', lines.length === 0);
      const packs = lines.reduce((sum, l) => sum + (Number(l.packs) || 0), 0);
      const games = `${lines.length} game${lines.length === 1 ? '' : 's'}`;
      $('saveBtn').textContent = mode === 'shipment'
        ? `Save shipment (${games}, ${packs} pack${packs === 1 ? '' : 's'})`
        : `Save count (${games})`;
    }

    function lineCard(line) {
      const game = known(line.gameNumber);
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.game = line.gameNumber;

      const top = document.createElement('div');
      top.className = 'row';
      const name = document.createElement('strong');
      name.textContent = game ? `Game ${line.gameNumber} · $${game.price}` : `Game ${line.gameNumber} · new`;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'small';
      remove.textContent = 'Remove';
      remove.addEventListener('click', () => { lines = lines.filter((l) => l !== line); saveDraft(); render(); });
      top.append(name, remove);
      card.append(top);

      const info = document.createElement('div');
      info.className = 'slot-detail';
      info.textContent = !game ? 'Not set up yet. Pack size comes from the price.'
        : game.endedDate ? `Marked ended on ${game.endedDate}. Saving brings it back · ${game.ticketsPerPack} tickets per pack`
          : `${game.ticketsPerPack} tickets per pack · ${game.packsInBack} in the back now`;
      card.append(info);

      if (!game) {
        card.append(field('Price per ticket ($)', line.gamePrice, 'decimal', (v) => {
          line.gamePrice = v;
          const standard = STANDARD_PACK_SIZES[Number(v)];
          if (standard) {
            line.ticketsPerPack = standard;
            card.querySelector('input.size').value = standard;
          }
        }));
        card.append(field('Tickets per pack', line.ticketsPerPack, 'numeric', (v) => { line.ticketsPerPack = v; }, 'size'));
      }

      const label = mode === 'shipment' ? 'Packs received' : 'Packs counted';
      card.append(field(label, line.packs, 'numeric', (v) => { line.packs = v; }, 'packs'));

      if (mode === 'count' && game && line.packs !== '' && Number(line.packs) !== game.packsInBack) {
        const diff = document.createElement('div');
        diff.className = 'slot-detail';
        const d = Number(line.packs) - game.packsInBack;
        diff.textContent = `${d > 0 ? '+' : ''}${d} pack${Math.abs(d) === 1 ? '' : 's'} compared to the app`;
        card.append(diff);
      }
      return card;
    }

    function field(labelText, value, inputmode, onChange, cls = '') {
      const wrap = document.createElement('div');
      const label = document.createElement('label');
      label.textContent = labelText;
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.step = '1';
      input.inputMode = inputmode;
      input.className = cls;
      input.value = value ?? '';
      input.addEventListener('input', () => { onChange(input.value); saveDraft(); updateSaveLabel(); });
      input.addEventListener('change', () => render());
      label.append(input);
      wrap.append(label);
      return wrap;
    }

    function updateSaveLabel() {
      const packs = lines.reduce((sum, l) => sum + (Number(l.packs) || 0), 0);
      if (mode === 'shipment') $('saveBtn').textContent = `Save shipment (${lines.length} game${lines.length === 1 ? '' : 's'}, ${packs} pack${packs === 1 ? '' : 's'})`;
    }

    // Quick lookup: games whose number contains what's typed (a typed ticket number uses its game).
    function renderSearch() {
      const results = $('searchResults');
      results.innerHTML = '';
      let query = $('search').value.replace(/\D/g, '');
      if (query.length > 4) query = query.slice(0, 4);
      if (!query) return;
      if (!stockLoaded) {
        results.textContent = 'Loading…';
        return;
      }
      const found = stock.filter((g) => g.gameNumber.includes(query));
      if (found.length === 0) {
        const none = document.createElement('div');
        none.className = 'message error';
        none.textContent = query.length === 4
          ? `Game ${query}: none in the back. It isn't in back stock at all.`
          : `No game number has ${query} in it.`;
        results.append(none);
        return;
      }
      for (const g of found) results.append(g.endedDate ? endedCard(g, $('searchMessage')) : stockCard(g, true));
    }

    function stockCard(g, withSlots) {
      const card = document.createElement('div');
      card.className = 'card' + (g.packsInBack === 0 ? ' inactive' : '');
      const top = document.createElement('div');
      top.className = 'row';
      const name = document.createElement('strong');
      name.textContent = `Game ${g.gameNumber} · $${g.price}`;
      const tag = document.createElement('span');
      tag.className = g.packsInBack === 0 ? 'tag warn' : 'tag live';
      tag.textContent = g.packsInBack === 0 ? 'none in the back' : `${g.packsInBack} pack${g.packsInBack === 1 ? '' : 's'}`;
      top.append(name, tag);
      const detail = document.createElement('div');
      detail.className = 'slot-detail';
      detail.textContent = `${g.ticketsInBack} tickets · ${money(g.valueInBack)} · ${g.ticketsPerPack} per pack`
        + (g.standardPackSize && g.ticketsPerPack !== g.standardPackSize ? ` (usually ${g.standardPackSize}!)` : '')
        + (!withSlots && g.liveSlots ? ` · live in ${g.liveSlots} slot${g.liveSlots === 1 ? '' : 's'}` : '');
      card.append(top, detail);
      if (withSlots) {
        const where = document.createElement('div');
        where.className = 'slot-detail';
        const slots = g.liveIn || [];
        where.textContent = slots.length
          ? `On display: ${slots.map((x) => `Box ${x.box} · Slot ${x.slot}`).join(', ')}`
          : 'Not in any slot now';
        card.append(where);
      }
      // Buttons on a search result report up here, next to it, not at the bottom of the page.
      const messageEl = withSlots ? $('searchMessage') : $('stockMessage');
      const buttons = [managePacksButton(g, messageEl)];
      if (g.packsInBack === 0 && !g.liveSlots) buttons.push(endGameButton(g, messageEl));
      card.append(actionRow(...buttons));
      return card;
    }

    function endedCard(g, messageEl) {
      const card = document.createElement('div');
      card.className = 'card inactive';
      const top = document.createElement('div');
      top.className = 'row';
      const name = document.createElement('strong');
      name.textContent = `Game ${g.gameNumber} · $${g.price}`;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = `ended ${g.endedDate}`;
      top.append(name, tag);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'small';
      button.textContent = 'Bring back';
      button.addEventListener('click', () => changeGame(button, 'bringBackGame', g, messageEl, `Game ${g.gameNumber} is back in back stock.`));
      card.append(top, actionRow(button));
      return card;
    }

    // Only offered when none of the game is left: no packs in the back and not in a slot.
    function endGameButton(g, messageEl) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'small';
      button.textContent = 'Game ended…';
      button.addEventListener('click', () => {
        if (!confirm(`Mark game ${g.gameNumber} as ended? Do this when CA Lottery has stopped the game. It disappears from back stock. Its sales history stays, and receiving a pack of it later brings it back.`)) return;
        changeGame(button, 'endGame', g, messageEl, `Game ${g.gameNumber} marked ended and hidden. It's under "Ended games" at the bottom if you need it back.`);
      });
      return button;
    }

    async function changeGame(button, action, g, messageEl, done) {
      try {
        stock = await whileBusy(button, '…', () => api(action, { gameNumber: g.gameNumber }));
        renderStock();
        showMessage(messageEl, done, 'ok');
      } catch (err) {
        showMessage(messageEl, err.message);
      }
    }

    function actionRow(...buttons) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.marginTop = '8px';
      row.style.justifyContent = 'flex-start';
      row.append(...buttons);
      return row;
    }

    function renderStock() {
      const games = active();
      const total = games.reduce((sum, g) => sum + g.valueInBack, 0);
      const packs = games.reduce((sum, g) => sum + g.packsInBack, 0);
      $('totals').textContent = `${packs} packs · ${money(total)} at ticket price`;
      const list = $('stock');
      list.innerHTML = '';
      if (games.length === 0) list.textContent = 'No games yet.';
      for (const g of games) list.append(stockCard(g, false));

      const gone = ended();
      $('endedBox').classList.toggle('hidden', gone.length === 0);
      $('endedTitle').textContent = `Ended games (${gone.length})`;
      $('ended').innerHTML = '';
      for (const g of gone) $('ended').append(endedCard(g, $('stockMessage')));
      renderSearch();
    }

    // --- Manage packs dialog ---

    let dialog = null;   // { g, count, messageEl } while open

    function managePacksButton(g, messageEl) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'small';
      button.textContent = 'Manage packs';
      button.addEventListener('click', () => openPackDialog(g, messageEl));
      return button;
    }

    function openPackDialog(g, messageEl) {
      dialog = { g, count: g.packsInBack, messageEl };
      $('packTitle').textContent = `Game ${g.gameNumber} · $${g.price}`;
      showCountStep();
      $('packDialog').classList.remove('hidden');
    }

    function showCountStep() {
      $('packReasonStep').classList.add('hidden');
      $('packCountStep').classList.remove('hidden');
      renderPackDialog();
    }

    function renderPackDialog() {
      const change = dialog.count - dialog.g.packsInBack;
      $('packCount').textContent = dialog.count;
      $('packMinus').disabled = dialog.count === 0;
      $('packChange').textContent = change === 0 ? 'No change'
        : `${change > 0 ? '+' : '−'}${Math.abs(change)} pack${Math.abs(change) === 1 ? '' : 's'} (was ${dialog.g.packsInBack})`;
    }

    function closePackDialog() {
      dialog = null;
      $('packDialog').classList.add('hidden');
    }

    // Buttons locked while a change is being sent.
    const dialogButtons = () => [...document.querySelectorAll('#packDialog button')];

    async function sendChange(busyButton, busyText, action, params, done) {
      const { g, messageEl } = dialog;
      const locked = dialogButtons().filter((b) => b !== busyButton);
      locked.forEach((b) => { b.disabled = true; });
      try {
        const result = await whileBusy(busyButton, busyText, () => api(action, { gameNumber: g.gameNumber, ...params }));
        stock = result.backStock || result;
        closePackDialog();
        renderStock();
        showMessage(messageEl, done(result), 'ok');
      } catch (err) {
        closePackDialog();
        showMessage(messageEl, err.message);
      } finally {
        locked.forEach((b) => { b.disabled = false; });
      }
    }

    $('packPlus').addEventListener('click', () => { if (dialog.count < 999) dialog.count += 1; renderPackDialog(); });
    $('packMinus').addEventListener('click', () => { if (dialog.count > 0) dialog.count -= 1; renderPackDialog(); });
    $('packCancel').addEventListener('click', closePackDialog);
    $('reasonCancel').addEventListener('click', closePackDialog);
    $('reasonBack').addEventListener('click', showCountStep);

    // Save: more packs are received as a shipment now; fewer packs go to the "why" step first.
    $('packSave').addEventListener('click', () => {
      const { g, count } = dialog;
      const change = count - g.packsInBack;
      if (change === 0) { closePackDialog(); return; }
      if (change > 0) {
        sendChange($('packSave'), 'Saving…', 'adjustBackStock', { change },
          (r) => `Game ${g.gameNumber}: ${r.before} → ${r.after} pack${r.after === 1 ? '' : 's'} in the back.`);
        return;
      }
      const packs = -change;
      $('packReasonTitle').textContent = `Remove ${packs} pack${packs === 1 ? '' : 's'} (${g.packsInBack} → ${count} in the back). Why?`;
      $('packCountStep').classList.add('hidden');
      $('packReasonStep').classList.remove('hidden');
    });

    // Tapping a reason is what removes the packs.
    document.querySelectorAll('#removeReasons button').forEach((b) => b.addEventListener('click', () => {
      const { g, count } = dialog;
      const packs = g.packsInBack - count;
      const reason = b.dataset.reason;
      sendChange(b, 'Removing…', 'removeBackStock', { packs, reason },
        () => `Removed ${packs} pack${packs === 1 ? '' : 's'} of game ${g.gameNumber} (${reason}): ${g.packsInBack} → ${count} in the back.`);
    }));

    // --- Shipment received dialog ---

    let ship = null;   // { gameNumber, game, count } while open

    // A scan lands while the finger is still on "Press and hold to scan". Opening the pop-up under that
    // finger made iPhones swallow the first tap on +, so wait until it's lifted. A typed game closes the
    // keyboard first, so the pop-up doesn't jump when it goes away.
    function whenHandsFree(fn) {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      const hold = $('holdBtn');
      if (!hold.classList.contains('holding')) { fn(); return; }
      let opened = false;
      const go = () => {
        if (opened) return;
        opened = true;
        hold.removeEventListener('pointerup', go);
        hold.removeEventListener('pointercancel', go);
        setTimeout(fn, 100);
      };
      hold.addEventListener('pointerup', go);
      hold.addEventListener('pointercancel', go);
    }

    function openShipDialog(gameNumber) {
      const game = known(gameNumber);
      ship = { gameNumber, game, count: 1 };
      $('shipTitle').textContent = game ? `Game ${gameNumber} · $${game.price}` : `Game ${gameNumber} · new`;
      $('shipInfo').textContent = !game ? 'Not in back stock yet. Enter its price; the pack size fills in.'
        : game.endedDate ? `Marked ended on ${game.endedDate}. Saving brings it back.` : '';
      $('shipNewGame').classList.toggle('hidden', !!game);
      $('shipPrice').value = '';
      $('shipSize').value = '';
      renderShipDialog();
      $('shipDialog').classList.remove('hidden');
    }

    function renderShipDialog() {
      const before = ship.game ? ship.game.packsInBack : 0;
      $('shipCount').textContent = ship.count;
      $('shipMinus').disabled = ship.count === 0;
      $('shipChange').textContent = ship.count === 0 ? 'No packs received'
        : `Back will have ${before + ship.count} (now ${before})`;
      const priced = ship.game || (Number($('shipPrice').value) > 0 && Number($('shipSize').value) > 0);
      $('shipSave').disabled = ship.count === 0 || !priced;
    }

    function closeShipDialog() {
      ship = null;
      $('shipDialog').classList.add('hidden');
    }

    $('shipPlus').addEventListener('click', () => { if (ship.count < 999) ship.count += 1; renderShipDialog(); });
    $('shipMinus').addEventListener('click', () => { if (ship.count > 0) ship.count -= 1; renderShipDialog(); });
    $('shipCancel').addEventListener('click', closeShipDialog);
    $('shipPrice').addEventListener('input', () => {
      const standard = STANDARD_PACK_SIZES[Number($('shipPrice').value)];
      if (standard) $('shipSize').value = standard;
      renderShipDialog();
    });
    $('shipSize').addEventListener('input', renderShipDialog);

    // Save: the packs are added to the back now, as a delivery.
    $('shipSave').addEventListener('click', async () => {
      const { gameNumber, game, count } = ship;
      const line = { gameNumber, packs: count };
      if (!game) {
        line.gamePrice = $('shipPrice').value;
        line.ticketsPerPack = $('shipSize').value;
        const standard = STANDARD_PACK_SIZES[Number(line.gamePrice)];
        if (standard && Number(line.ticketsPerPack) !== standard
          && !confirm(`Game ${gameNumber}: $${line.gamePrice} packs usually have ${standard} tickets, not ${line.ticketsPerPack}. Save anyway?`)) return;
      }
      $('shipCancel').disabled = true;
      try {
        const result = await whileBusy($('shipSave'), 'Saving…', () =>
          api('saveBackStock', { mode: 'shipment', lines: [line] }));
        stock = result.backStock;
        const r = result.results[0];
        closeShipDialog();
        renderStock();
        flash(`Game ${gameNumber}: ${count} pack${count === 1 ? '' : 's'} received, ${r.before} → ${r.after} in the back.`);
      } catch (err) {
        closeShipDialog();
        flash(err.message, 'error');
      } finally {
        $('shipCancel').disabled = false;
      }
    });

    // --- Actions ---

    document.querySelectorAll('#modeSwitch button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.mode === mode) return;
      if (lines.length && !confirm('Switch? The games on the list stay, but check the numbers — a shipment adds packs, a count replaces them.')) return;
      mode = b.dataset.mode;
      saveDraft();
      render();
    }));

    $('typedForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('typed').value.trim();
      try {
        addGame(/^\d{4}$/.test(text) ? text : parsePrintedTicket(text).gameNumber);
        $('typed').value = '';
      } catch (err) {
        flash(err.message, 'error');
      }
    });

    $('notes').addEventListener('input', saveDraft);
    $('search').addEventListener('input', () => {
      $('searchMessage').className = 'message';
      $('searchMessage').textContent = '';
      renderSearch();
    });

    $('clearBtn').addEventListener('click', () => {
      if (!confirm('Clear the list without saving?')) return;
      lines = [];
      $('notes').value = '';
      saveDraft();
      render();
    });

    $('saveBtn').addEventListener('click', async () => {
      $('saveMessage').className = 'message';
      const missing = lines.find((l) => l.packs === '' || l.packs == null);
      if (missing) {
        showMessage($('saveMessage'), `Enter the packs for game ${missing.gameNumber}.`);
        focusLine(missing.gameNumber);
        return;
      }
      const odd = lines.find((l) => !known(l.gameNumber) && STANDARD_PACK_SIZES[Number(l.gamePrice)]
        && Number(l.ticketsPerPack) !== STANDARD_PACK_SIZES[Number(l.gamePrice)]);
      if (odd && !confirm(`Game ${odd.gameNumber}: $${odd.gamePrice} packs usually have ${STANDARD_PACK_SIZES[Number(odd.gamePrice)]} tickets, not ${odd.ticketsPerPack}. Save anyway?`)) return;
      try {
        const result = await whileBusy($('saveBtn'), 'Saving…', () =>
          api('saveBackStock', { mode, lines, notes: $('notes').value }));
        stock = result.backStock;
        const summary = result.results.map((r) => `${r.gameNumber}: ${r.before} → ${r.after}`).join(', ');
        lines = [];
        $('notes').value = '';
        saveDraft();
        render();
        renderStock();
        showMessage($('saveMessage'), `${mode === 'shipment' ? 'Shipment' : 'Count'} saved. Packs in the back — ${summary}.`, 'ok');
      } catch (err) {
        showMessage($('saveMessage'), err.message);
      }
    });

    // --- Start ---

    async function start() {
      loadDraft();
      render();
      // Last load first (dimmed, buttons off), then the fresh one. Scans and search wait for the fresh one,
      // since they decide from it whether a game is new.
      await loadSaved('backstock', () => api('listBackStock'), (data, fresh) => {
        stock = data;
        stockLoaded = fresh;
        render();
        renderStock();
      });
      await startScanner({
        video: $('video'),
        viewport: $('viewport'),
        holdBtn: $('holdBtn'),
        onStatus: (text) => (text ? flash(text, 'error') : null),
        onScan: (ticket) => addGame(ticket.gameNumber),
      });
    }

    // A failed load keeps the saved list on screen (dimmed, buttons off) above the reason.
    if (session) start().catch((err) => { if (!stockLoaded && !document.body.classList.contains('showing-saved')) $('stock').textContent = ''; showMessage($('stockMessage'), err.message); });
  </script>
</body>
</html>
