<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Back Stock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Back Stock" data-help="backstock"></header>
  <!-- Why the page could not load, with Try again: at the top so it is seen without scrolling. -->
  <div id="loadMessage" class="message"></div>

  <!-- Owner: two views (owner 2026-11-11). Backstock (the list, opens first) and Scan (the camera and the three modes;
       the camera only runs here). An employee has no list, so no switch: only Scan. -->
  <div class="segmented view-switch hidden" id="viewSwitch">
    <button type="button" data-view="stock">Backstock</button>
    <button type="button" data-view="scan">Scan</button>
  </div>

  <div id="stockView" class="hidden">
    <p class="sub saved-dim" id="totals"></p>
    <div class="search-field">
      <input id="search" type="search" inputmode="numeric" autocomplete="off" placeholder="Find a game, e.g. 1747" aria-label="Find a game">
    </div>
    <div id="stockMessage" class="message"></div>
    <!-- Games with packs in the back, grouped by price (highest first), one row each; a row opens Manage Packs. -->
    <div id="stock" class="saved-dim saved-lock">Loading…</div>
    <div id="searchNone" class="message error hidden"></div>
    <!-- 0 packs in the back, folded. Still live in a slot = Order More (the reorder list). -->
    <details id="emptyBox" class="fold-box hidden saved-dim saved-lock">
      <summary><span id="emptyTitle"></span><span class="tag days hidden" id="orderCount"></span></summary>
      <div class="stock-group" id="empty"></div>
      <p class="sub fold-note">Order More: still live in a slot, with no packs left in the back.</p>
    </details>
    <!-- Games the lottery has stopped, hidden from the list above. -->
    <details id="endedBox" class="fold-box hidden saved-dim saved-lock">
      <summary><span id="endedTitle"></span></summary>
      <p class="sub fold-note">Hidden from back stock. Receiving a pack of one, or putting one in a slot, brings it back by itself.</p>
      <div class="stock-group" id="ended"></div>
    </details>
  </div>

  <div id="scanView">
  <div class="segmented" id="modeSwitch">
    <button type="button" data-mode="shipment">Shipment Received</button>
    <button type="button" data-mode="count">Manage Stock</button>
    <button type="button" data-mode="fullpack">Full Pack Sale</button>
  </div>
  <p class="sub" id="modeHint"></p>

  <div class="scan-viewport paused" id="viewport">
    <video id="video" playsinline muted autoplay></video>
    <div class="scan-guide"></div>
  </div>
  <label class="button hold-button" id="holdBtn">Press and Hold to Scan</label>
  <div class="segmented" id="scanModeSwitch" style="margin-top: 10px;">
    <button type="button" data-mode="hold">Press and Hold</button>
    <button type="button" data-mode="auto">Auto Scan</button>
  </div>
  <div id="flash" class="message"></div>

  <!-- Shipment Received (owner 2026-11-11): one scan per pack adds it to this list (a second pack of a game adds to its
       line; the same pack twice is caught). One Receive saves the whole shipment; pack numbers go with it. -->
  <div id="shipArea" class="hidden">
    <div class="ship-head">
      <h2>This Shipment</h2>
      <span class="ship-sum" id="shipSum"></span>
    </div>
    <div id="shipList"></div>
    <div id="shipMessage" class="message"></div>
  </div>
  <div id="shipDone" class="card ship-done hidden"></div>

  <form id="typedForm">
    <label for="typed" id="typedLabel">Or Type a Ticket Number, or Just the 4-Digit Game Number</label>
    <input id="typed" inputmode="numeric" autocomplete="off" placeholder="1747-1263622-4-075 or 1747">
    <button type="submit" id="typedBtn">Add Game</button>
  </form>

  <div id="lines"></div>
  <div id="saveArea" class="hidden">
    <label for="notes">Notes (Optional)</label>
    <input id="notes" autocomplete="off" placeholder="e.g. invoice number">
    <button type="button" class="primary" id="saveBtn">Save</button>
    <button type="button" id="clearBtn">Clear List</button>
  </div>
  <div id="saveMessage" class="message"></div>
  </div>

  <!-- Manage packs: + / − the packs of one game in the back, then Save. More packs are saved at once
       (as a shipment); fewer first asks why, and nothing changes until a reason is tapped. -->
  <div id="packDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="packTitle">
    <div class="dialog">
      <div class="dialog-title" id="packTitle"></div>
      <div class="slot-detail" id="packInfo"></div>
      <div class="pack-where" id="packWhere"></div>
      <div id="packCountStep">
        <div class="slot-detail">Packs in the Back</div>
        <div class="stepper">
          <button type="button" id="packMinus" aria-label="One pack less">−</button>
          <div class="stepper-count" id="packCount"></div>
          <button type="button" id="packPlus" aria-label="One pack more">+</button>
        </div>
        <div class="slot-detail" id="packChange"></div>
        <div class="dialog-buttons">
          <button type="button" class="cancel" id="packCancel">Cancel</button>
          <button type="button" class="save" id="packSave">Save</button>
        </div>
        <!-- Only when none of the game is left: no packs in the back and not in a slot. -->
        <button type="button" class="text-action pack-end hidden" id="packEnd">Game Ended…</button>
      </div>
      <div id="packReasonStep" class="hidden">
        <div class="dialog-label" id="packReasonTitle"></div>
        <div class="reasons" id="removeReasons">
          <button type="button" data-reason="returned">Returned</button>
          <button type="button" data-reason="game expired">Game Expired</button>
          <button type="button" data-reason="damaged">Damaged</button>
          <button type="button" data-reason="stolen">Stolen</button>
          <button type="button" data-reason="other">Other</button>
        </div>
        <div class="dialog-buttons">
          <button type="button" class="cancel" id="reasonCancel">Cancel</button>
          <button type="button" id="reasonBack">Back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Full pack sale: scanning (or typing) a ticket of a sealed pack opens this. Sell takes that pack off
       back stock and counts it in today's sales (listed on the owner's Full pack sales page). -->
  <div id="sellDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="sellTitle">
    <div class="dialog">
      <div class="dialog-title" id="sellTitle">Sell Full Pack</div>
      <div class="slot-detail mono" id="sellPack"></div>
      <div class="stepper-count" id="sellValue"></div>
      <div class="slot-detail" id="sellMath"></div>
      <div class="slot-detail" id="sellBack"></div>
      <div class="dialog-buttons">
        <button type="button" class="cancel" id="sellCancel">Cancel</button>
        <button type="button" class="save" id="sellSave">Sell</button>
      </div>
    </div>
  </div>

  <!-- Receive: floats above the tab bar while a shipment list has packs. -->
  <div class="bulk-bar above-tabbar hidden" id="receiveBar">
    <button type="button" class="primary" id="receiveBtn">Receive</button>
  </div>

  <nav class="tabbar" data-active="stock"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script src="barcode.js"></script>
  <script type="module">
    import { startScanner, scanModeSwitch, afterLift, haptic } from './scanner.js';

    // Scan one ticket from each game, type how many packs, and save the whole list at once.
    // The list is kept on this phone until saved.

    // The owner, or an employee the owner gave Receive shipments, Manage Stock or Full pack sale to. An employee
    // gets only those modes, with no Find a game, no list of what's in the back and no dollar amounts.
    const MODE_PERMISSIONS = { shipment: 'receive_shipments', count: 'count_stock', fullpack: 'full_pack_sale' };
    const session = requireLogin(Object.values(MODE_PERMISSIONS));
    const isOwner = Boolean(session) && session.role === 'owner';
    const modes = Object.keys(MODE_PERMISSIONS).filter((m) => can(session, MODE_PERMISSIONS[m]));
    const $ = (id) => document.getElementById(id);
    const money = (n) => `$${Number(n).toLocaleString()}`;
    const DRAFT_KEY = 'smartScanBackStockDraft';
    const HINTS = {
      shipment: 'Scan one ticket from every pack in the delivery. Each scan adds that pack to the list; tap Receive when they\'re all on it.',
      fullpack: 'A customer buys a whole sealed pack from the back: scan any ticket of that pack, check the pop-up and tap Sell. One pack comes off back stock and it counts in today\'s sales.',
      count: 'Scan one ticket from each game on the shelf and enter how many packs you counted. That becomes the number in the back; any difference is logged. Games you don\'t scan are left as they are.',
    };

    let mode = 'shipment';
    let lines = [];      // { gameNumber, packs, gamePrice?, ticketsPerPack? }
    let stock = [];      // from listBackStock
    let stockLoaded = false;


    // --- Draft ---
    function saveDraft() {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ mode, lines, ship: shipLines, notes: $('notes').value })); } catch (e) {}
    }
    function loadDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        if (draft) {
          mode = draft.mode === 'count' ? 'count' : 'shipment';   // a full pack sale is never left as a draft
          lines = Array.isArray(draft.lines) ? draft.lines : [];
          // The shipment list (from 2026-11-11); one from before, with packs as a number, isn't kept.
          shipLines = (Array.isArray(draft.ship) ? draft.ship : []).filter((l) => l && /^\d{4}$/.test(l.gameNumber)
            && Array.isArray(l.packs) && l.packs.length);
          $('notes').value = draft.notes || '';
        }
      } catch (e) {}
    }

    const known = (gameNumber) => stock.find((g) => g.gameNumber === gameNumber);
    const active = () => stock.filter((g) => !g.endedDate);
    const ended = () => stock.filter((g) => g.endedDate);

    function flash(text, kind = 'ok') { showMessage($('flash'), text, kind); }

    // A scanned or typed ticket: in Full pack sale mode the pack number is needed too.
    function addTicket(ticket) {
      if (mode === 'shipment') { addShipPack(ticket.gameNumber, ticket.packNumber); return; }
      if (mode !== 'fullpack') { addGame(ticket.gameNumber); return; }
      if (!stockLoaded) { flash('Still loading back stock. Try again in a moment.', 'error'); return; }
      const game = known(ticket.gameNumber);
      if (!game || game.packsInBack < 1) {
        flash(`No packs of game ${ticket.gameNumber} in the back, so it can't be sold as a full pack. Receive the shipment first.`, 'error');
        return;
      }
      whenHandsFree(() => openSellDialog(game, ticket.packNumber));
    }

    function addGame(gameNumber) {
      // A typed game number: a pack without its number.
      if (mode === 'shipment') { addShipPack(gameNumber, null); return; }
      const existing = lines.find((l) => l.gameNumber === gameNumber);
      if (existing) {
        flash(`Game ${gameNumber} is already on the list — change its number of packs below.`);
        focusLine(gameNumber);
        return;
      }
      const game = known(gameNumber);
      const line = { gameNumber, packs: mode === 'count' && game ? game.packsInBack : '' };
      lines.unshift(line);
      saveDraft();
      render();
      flash(game ? `Game ${gameNumber} ($${game.price}) added. Enter the packs.` : `Game ${gameNumber} is new — enter its price and the packs.`);
      focusLine(gameNumber);
    }

    function focusLine(gameNumber) {
      const input = document.querySelector(`[data-game="${gameNumber}"] input.packs`);
      if (input) { input.focus(); input.select(); }
    }

    // --- Drawing ---

    function render() {
      document.querySelectorAll('#modeSwitch button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
      $('modeHint').textContent = HINTS[mode];
      // Shipment Received says it in its This Shipment box instead.
      $('modeHint').classList.toggle('hidden', mode === 'shipment');

      // Shipment: one pack per scan (a full ticket number, or a game number for a pack without its number).
      $('typedLabel').textContent = mode === 'shipment' ? 'Or Type the Ticket Number, or Just the 4-Digit Game Number'
        : mode === 'fullpack' ? 'Or Type the Ticket Number' : 'Or Type a Ticket Number, or Just the 4-Digit Game Number';
      $('typedBtn').textContent = mode === 'shipment' ? 'Add Pack' : mode === 'fullpack' ? 'Use This Number' : 'Add Game';

      // Each mode keeps its own list (shipment, count); neither shows while selling full packs.
      const list = $('lines');
      list.innerHTML = '';
      if (mode === 'count') for (const line of lines) list.append(lineCard(line));
      renderShip();
      const listed = mode === 'count' ? lines.length : mode === 'shipment' ? shipLines.length : 0;
      $('saveArea').classList.toggle('hidden', listed === 0);
      // A shipment is received from the bar at the bottom; a count is saved here.
      $('saveBtn').classList.toggle('hidden', mode !== 'count');
      $('saveBtn').textContent = `Save Count (${plural(lines.length, 'Game')})`;
    }

    function lineCard(line) {
      const game = known(line.gameNumber);
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.game = line.gameNumber;

      const top = document.createElement('div');
      top.className = 'row';
      const name = document.createElement('strong');
      name.textContent = game ? `Game ${line.gameNumber} · $${game.price}` : `Game ${line.gameNumber} · New`;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'small';
      remove.textContent = 'Remove';
      remove.addEventListener('click', () => { lines = lines.filter((l) => l !== line); saveDraft(); render(); });
      top.append(name, remove);
      card.append(top);

      const info = document.createElement('div');
      info.className = 'slot-detail';
      info.textContent = !game ? 'Not set up yet. Pack size comes from the price.'
        : game.endedDate ? `Marked ended on ${game.endedDate}. Saving brings it back · ${game.ticketsPerPack} tickets per pack`
          : `${game.ticketsPerPack} tickets per pack · ${game.packsInBack} in the back now`;
      card.append(info);

      if (!game) {
        card.append(field('Price per Ticket ($)', line.gamePrice, 'decimal', (v) => {
          line.gamePrice = v;
          const standard = STANDARD_PACK_SIZES[Number(v)];
          if (standard) {
            line.ticketsPerPack = standard;
            card.querySelector('input.size').value = standard;
          }
        }));
        card.append(field('Tickets per Pack', line.ticketsPerPack, 'numeric', (v) => { line.ticketsPerPack = v; }, 'size'));
      }

      const label = mode === 'shipment' ? 'Packs Received' : 'Packs Counted';
      card.append(field(label, line.packs, 'numeric', (v) => { line.packs = v; }, 'packs'));

      if (mode === 'count' && game && line.packs !== '' && Number(line.packs) !== game.packsInBack) {
        const diff = document.createElement('div');
        diff.className = 'slot-detail';
        const d = Number(line.packs) - game.packsInBack;
        diff.textContent = `${d > 0 ? '+' : ''}${d} pack${Math.abs(d) === 1 ? '' : 's'} compared to the app`;
        card.append(diff);
      }
      return card;
    }

    function field(labelText, value, inputmode, onChange, cls = '') {
      const wrap = document.createElement('div');
      const label = document.createElement('label');
      label.textContent = labelText;
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.step = '1';
      input.inputMode = inputmode;
      input.className = cls;
      input.value = value ?? '';
      input.addEventListener('input', () => { onChange(input.value); saveDraft(); updateSaveLabel(); });
      input.addEventListener('change', () => render());
      label.append(input);
      wrap.append(label);
      return wrap;
    }

    function updateSaveLabel() {
      const packs = lines.reduce((sum, l) => sum + (Number(l.packs) || 0), 0);
      if (mode === 'shipment') $('saveBtn').textContent = `Save Shipment (${lines.length} Game${lines.length === 1 ? '' : 's'}, ${packs} Pack${packs === 1 ? '' : 's'})`;
    }

    // --- The Backstock list (owner, owner 2026-11-11) ---
    // Games with packs in the back, grouped by price (highest first), one tappable row each. Games with none in the back
    // fold into "None in the Back"; one still live in a slot there is tagged Order More. Find a Game filters all of it.

    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
    // The digits typed in Find a Game, up to a game number (a typed ticket number uses its game).
    const searchQuery = () => $('search').value.replace(/\D/g, '').slice(0, 4);
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // Number, packs, slots it's live in, then its value (or Order More); tapping it opens Manage Packs.
    function stockRow(g) {
      const row = el('button', 'stock-row');
      row.type = 'button';
      row.dataset.game = g.gameNumber;
      const orderMore = g.packsInBack === 0 && g.liveSlots > 0;
      if (g.packsInBack === 0 && !orderMore) row.classList.add('dim');
      const mid = el('span', 'stock-mid');
      if (g.packsInBack > 0) mid.append(el('span', 'stock-packs', plural(g.packsInBack, 'Pack')));
      mid.append(el('span', 'stock-live' + (g.liveSlots ? '' : ' none'), g.liveSlots ? `${g.liveSlots} Live` : 'Not Live'));
      const end = orderMore ? el('span', 'tag days', 'Order More') : el('span', 'stock-value', g.packsInBack ? money(g.valueInBack) : '');
      const chevron = el('span', 'stock-chevron');
      chevron.innerHTML = icon('chevronRight');
      row.append(el('span', 'stock-num mono', g.gameNumber), mid, end, chevron);
      row.addEventListener('click', () => openPackDialog(g));
      return row;
    }

    function endedRow(g) {
      const row = el('div', 'stock-row ended-row');
      const button = el('button', 'small', 'Bring Back');
      button.type = 'button';
      button.addEventListener('click', () => changeGame(button, 'bringBackGame', g, `Game ${g.gameNumber} is back in back stock.`));
      row.append(el('span', 'stock-num mono', g.gameNumber), el('span', 'stock-mid', `$${g.price} · Ended ${g.endedDate}`), button);
      return row;
    }

    // A folded list hides when it has nothing. While searching it opens to show what matches; otherwise it stays
    // open or shut the way the owner left it.
    const foldOpen = {};
    function fold(box, list, rows, total, query) {
      list.replaceChildren(...rows);
      box.classList.toggle('hidden', total === 0 || (Boolean(query) && rows.length === 0));
      box.open = query ? rows.length > 0 : Boolean(foldOpen[box.id]);
    }
    for (const id of ['emptyBox', 'endedBox']) $(id).addEventListener('toggle', () => { if (!searchQuery()) foldOpen[id] = $(id).open; });

    function renderStock() {
      if (!isOwner) return;
      const games = active();
      const total = games.reduce((sum, g) => sum + g.valueInBack, 0);
      const packs = games.reduce((sum, g) => sum + g.packsInBack, 0);
      $('totals').textContent = `${plural(packs, 'pack')} · ${money(total)} at ticket price`;
      const query = searchQuery();
      const hit = (g) => !query || g.gameNumber.includes(query);
      const newestFirst = (a, b) => b.gameNumber.localeCompare(a.gameNumber);

      const list = $('stock');
      list.innerHTML = '';
      const stocked = games.filter((g) => g.packsInBack > 0);
      if (!query && games.length === 0) list.textContent = 'No games yet.';
      else if (!query && stocked.length === 0) list.textContent = 'Nothing in the back now.';
      let shown = 0;
      for (const price of [...new Set(stocked.map((g) => g.price))].sort((a, b) => b - a)) {
        const group = stocked.filter((g) => g.price === price);
        const rows = group.filter(hit).sort(newestFirst);
        if (!rows.length) continue;
        shown += rows.length;
        const groupPacks = group.reduce((sum, g) => sum + g.packsInBack, 0);
        const groupValue = group.reduce((sum, g) => sum + g.valueInBack, 0);
        const head = el('div', 'stock-price-head');
        head.append(el('span', 'stock-price', `$${price}`), el('span', 'stock-price-sum', `${plural(groupPacks, 'pack')} · ${money(groupValue)}`));
        const box = el('div', 'stock-group');
        box.append(...rows.map(stockRow));
        const section = el('section', 'stock-price-group');
        section.append(head, box);
        list.append(section);
      }

      // Order More first, then by price.
      const empty = games.filter((g) => g.packsInBack === 0)
        .sort((a, b) => (b.liveSlots > 0) - (a.liveSlots > 0) || b.price - a.price || newestFirst(a, b));
      const emptyHits = empty.filter(hit);
      fold($('emptyBox'), $('empty'), emptyHits.map(stockRow), empty.length, query);
      $('emptyTitle').textContent = `None in the Back (${empty.length})`;
      const toOrder = empty.filter((g) => g.liveSlots > 0).length;
      $('orderCount').textContent = `${toOrder} to Order`;
      $('orderCount').classList.toggle('hidden', toOrder === 0);

      const gone = ended();
      const goneHits = gone.filter(hit);
      fold($('endedBox'), $('ended'), goneHits.map(endedRow), gone.length, query);
      $('endedTitle').textContent = `Ended Games (${gone.length})`;

      // Nothing has the number typed.
      const none = Boolean(query) && shown + emptyHits.length + goneHits.length === 0;
      $('searchNone').classList.toggle('hidden', !none);
      $('searchNone').textContent = !none ? ''
        : query.length === 4 ? `Game ${query} isn't in back stock at all.` : `No game number has ${query} in it.`;
    }

    async function changeGame(button, action, g, done) {
      try {
        stock = await whileBusy(button, '…', () => api(action, { gameNumber: g.gameNumber }));
        renderStock();
        showMessage($('stockMessage'), done, 'ok');
      } catch (err) {
        showMessage($('stockMessage'), err.message);
      }
    }

    // --- Manage packs dialog ---

    let dialog = null;   // { g, count, messageEl } while open

    // What the row didn't have room for: tickets, value, pack size, and the slots it's on display in.
    function openPackDialog(g) {
      dialog = { g, count: g.packsInBack, messageEl: $('stockMessage') };
      $('packTitle').textContent = `Game ${g.gameNumber} · $${g.price}`;
      $('packInfo').textContent = (g.packsInBack ? `${g.ticketsInBack} tickets · ${money(g.valueInBack)} · ` : '')
        + `${g.ticketsPerPack} per pack`
        + (g.standardPackSize && g.ticketsPerPack !== g.standardPackSize ? ` (usually ${g.standardPackSize}!)` : '');
      const slots = g.liveIn || [];
      $('packWhere').textContent = slots.length
        ? `On display: ${slots.map((x) => `Box ${x.box} · Slot ${x.slot}`).join(', ')}`
        : 'Not in any slot now';
      $('packEnd').classList.toggle('hidden', !(g.packsInBack === 0 && !g.liveSlots));
      showCountStep();
      $('packDialog').classList.remove('hidden');
    }

    function showCountStep() {
      $('packReasonStep').classList.add('hidden');
      $('packCountStep').classList.remove('hidden');
      renderPackDialog();
    }

    function renderPackDialog() {
      const change = dialog.count - dialog.g.packsInBack;
      $('packCount').textContent = dialog.count;
      $('packMinus').disabled = dialog.count === 0;
      $('packChange').textContent = change === 0 ? 'No Change'
        : `${change > 0 ? '+' : '−'}${Math.abs(change)} pack${Math.abs(change) === 1 ? '' : 's'} (was ${dialog.g.packsInBack})`;
    }

    function closePackDialog() {
      dialog = null;
      $('packDialog').classList.add('hidden');
    }

    // Buttons locked while a change is being sent.
    const dialogButtons = () => [...document.querySelectorAll('#packDialog button')];

    async function sendChange(busyButton, busyText, action, params, done) {
      const { g, messageEl } = dialog;
      const locked = dialogButtons().filter((b) => b !== busyButton);
      locked.forEach((b) => { b.disabled = true; });
      try {
        const result = await whileBusy(busyButton, busyText, () => api(action, { gameNumber: g.gameNumber, ...params }));
        stock = result.backStock || result;
        closePackDialog();
        renderStock();
        showMessage(messageEl, done(result), 'ok');
      } catch (err) {
        closePackDialog();
        showMessage(messageEl, err.message);
      } finally {
        locked.forEach((b) => { b.disabled = false; });
      }
    }

    $('packPlus').addEventListener('click', () => { if (dialog.count < 999) dialog.count += 1; renderPackDialog(); });
    $('packMinus').addEventListener('click', () => { if (dialog.count > 0) dialog.count -= 1; renderPackDialog(); });
    $('packCancel').addEventListener('click', closePackDialog);
    $('reasonCancel').addEventListener('click', closePackDialog);
    $('reasonBack').addEventListener('click', showCountStep);

    // Save: more packs are received as a shipment now; fewer packs go to the "why" step first.
    $('packSave').addEventListener('click', () => {
      const { g, count } = dialog;
      const change = count - g.packsInBack;
      if (change === 0) { closePackDialog(); return; }
      if (change > 0) {
        sendChange($('packSave'), 'Saving…', 'adjustBackStock', { change },
          (r) => `Game ${g.gameNumber}: ${r.before} → ${r.after} pack${r.after === 1 ? '' : 's'} in the back.`);
        return;
      }
      const packs = -change;
      $('packReasonTitle').textContent = `Remove ${packs} Pack${packs === 1 ? '' : 's'} (${g.packsInBack} → ${count} in the Back). Why?`;
      $('packCountStep').classList.add('hidden');
      $('packReasonStep').classList.remove('hidden');
    });

    // Game Ended: only offered when none of the game is left (no packs in the back, not in a slot).
    $('packEnd').addEventListener('click', () => {
      const { g } = dialog;
      if (!confirm(`Mark game ${g.gameNumber} as ended? Do this when the lottery has stopped the game. It disappears from back stock. Its sales history stays, and receiving a pack of it later brings it back.`)) return;
      sendChange($('packEnd'), '…', 'endGame', {},
        () => `Game ${g.gameNumber} marked ended and hidden. It's under "Ended Games" at the bottom if you need it back.`);
    });

    // Tapping a reason is what removes the packs.
    document.querySelectorAll('#removeReasons button').forEach((b) => b.addEventListener('click', () => {
      const { g, count } = dialog;
      const packs = g.packsInBack - count;
      const reason = b.dataset.reason;
      sendChange(b, 'Removing…', 'removeBackStock', { packs, reason },
        () => `Removed ${packs} pack${packs === 1 ? '' : 's'} of game ${g.gameNumber} (${reason}): ${g.packsInBack} → ${count} in the back.`);
    }));

    // A scan lands while the finger is still on "Press and hold to scan". Opening the pop-up under that
    // finger made iPhones swallow the first tap on +, so wait until it's lifted. A typed game closes the
    // keyboard first, so the pop-up doesn't jump when it goes away.
    function whenHandsFree(fn) {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      const hold = $('holdBtn');
      if (!hold.classList.contains('holding')) { fn(); return; }
      let opened = false;
      const go = () => {
        if (opened) return;
        opened = true;
        hold.removeEventListener('pointerup', go);
        hold.removeEventListener('pointercancel', go);
        setTimeout(fn, 100);
      };
      hold.addEventListener('pointerup', go);
      hold.addEventListener('pointercancel', go);
    }

    // --- Shipment Received: one scan per pack (owner 2026-11-11) ---
    // Each scanned ticket adds its pack to this shipment's list; a second pack of a game adds to that game's line, and the
    // same pack twice is caught. A typed game number adds a pack without a number. One Receive saves it all, with the
    // pack numbers (the database keeps them and refuses a pack it already has; Sheets counts packs). Kept on the phone
    // (the draft) until then. Newest game first.
    let shipLines = [];        // { gameNumber, packs: ['1263622' | null (typed), …], gamePrice, ticketsPerPack }
    let refusedPack = null;    // "1747-0000003": the pack the server refused, marked red on its line

    const clearShipMessage = () => { $('shipMessage').className = 'message'; $('shipMessage').textContent = ''; };
    const shipPacks = () => shipLines.reduce((sum, l) => sum + l.packs.length, 0);
    const linePrice = (l) => { const g = known(l.gameNumber); return g ? g.price : Number(l.gamePrice) || 0; };
    const lineSize = (l) => { const g = known(l.gameNumber); return g ? g.ticketsPerPack : Number(l.ticketsPerPack) || 0; };
    const needsPrice = (l) => !known(l.gameNumber) && !(Number(l.gamePrice) > 0 && Number(l.ticketsPerPack) > 0);
    const shipValue = (list) => list.reduce((sum, l) => sum + l.packs.length * linePrice(l) * lineSize(l), 0);

    function addShipPack(gameNumber, packNumber) {
      if (!stockLoaded) { haptic('error'); flash('Still loading back stock. Try again in a moment.', 'error'); return; }
      let line = shipLines.find((l) => l.gameNumber === gameNumber);
      if (packNumber && line && line.packs.includes(packNumber)) {
        haptic('error');
        afterLift($('holdBtn'), () => flash(`Pack ${gameNumber}-${packNumber} is already on this shipment.`, 'error'));
        return;
      }
      if (!line) line = { gameNumber, packs: [], gamePrice: '', ticketsPerPack: '' };
      shipLines = [line, ...shipLines.filter((l) => l !== line)];
      line.packs.push(packNumber || null);
      $('shipDone').classList.add('hidden');
      clearShipMessage();
      saveDraft();
      const game = known(gameNumber);
      const count = line.packs.length;
      afterLift($('holdBtn'), () => {
        flash(`${packNumber ? `Pack ${gameNumber}-${packNumber}` : `Game ${gameNumber}`} added${count > 1 ? ` · ${count} packs of this game` : ''}.`
          + (!game ? ' New game: pick its price below.' : game.endedDate ? ' It was marked ended; receiving it brings it back.' : ''), 'ok');
        render();
      });
    }

    function takeOffPack(line, index) {
      line.packs.splice(index, 1);
      if (!line.packs.length) shipLines = shipLines.filter((l) => l !== line);
      refusedPack = null;
      clearShipMessage();
      saveDraft();
      render();
    }

    function shipRow(line) {
      const game = known(line.gameNumber);
      const row = el('div', 'ship-line');
      row.dataset.game = line.gameNumber;
      const top = el('div', 'ship-top');
      top.append(el('span', 'stock-num mono', line.gameNumber));
      if (game) top.append(el('span', 'ship-price', `$${game.price} · ${game.ticketsPerPack} per pack`));
      else top.append(el('span', 'tag days', 'New Game'));
      if (game && game.endedDate) top.append(el('span', 'tag', 'Was Ended'));
      // − takes off the last pack added to this game.
      const minus = el('button', 'ship-minus', '−');
      minus.type = 'button';
      minus.setAttribute('aria-label', `One pack less of game ${line.gameNumber}`);
      minus.addEventListener('click', () => takeOffPack(line, line.packs.length - 1));
      const packs = el('div', 'ship-packs');
      packs.append(el('span', 'ship-count' + (line.packs.length > 1 ? ' many' : ''), plural(line.packs.length, 'Pack')));
      line.packs.forEach((pack, i) => {
        // The pack the server refused is red, and tapping it takes it off.
        if (pack && refusedPack === `${line.gameNumber}-${pack}`) {
          const chip = el('button', 'ship-pk mono refused', `${pack} ×`);
          chip.type = 'button';
          chip.setAttribute('aria-label', `Take pack ${line.gameNumber}-${pack} off the list`);
          chip.addEventListener('click', () => takeOffPack(line, i));
          packs.append(chip);
        } else {
          packs.append(el('span', 'ship-pk mono', pack || 'Typed'));
        }
      });
      row.append(top, minus, packs);
      if (!game) row.append(newGameFields(line));
      if (refusedPack && refusedPack.startsWith(`${line.gameNumber}-`)) row.classList.add('refused');
      return row;
    }

    // A game the store has never had: its ticket price (chips; the usual pack size fills in) and the pack size.
    function newGameFields(line) {
      const box = el('div', 'ship-new');
      box.append(el('div', 'ship-new-label', Number(line.gamePrice) > 0 ? 'Ticket Price' : 'Pick the Ticket Price'));
      const chips = el('div', 'choice-chips');
      for (const price of Object.keys(STANDARD_PACK_SIZES).map(Number).sort((a, b) => a - b)) {
        const chip = el('button', Number(line.gamePrice) === price ? 'active' : '', `$${price}`);
        chip.type = 'button';
        chip.addEventListener('click', () => {
          line.gamePrice = String(price);
          line.ticketsPerPack = String(STANDARD_PACK_SIZES[price]);
          saveDraft();
          render();
        });
        chips.append(chip);
      }
      box.append(chips);
      if (Number(line.gamePrice) > 0) {
        const label = el('label', 'bulk-field', 'Tickets per Pack');
        const input = el('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '1';
        input.value = line.ticketsPerPack;
        input.addEventListener('input', () => { line.ticketsPerPack = input.value; saveDraft(); renderShipBar(); });
        label.append(input);
        box.append(label);
      }
      return box;
    }

    // Shown in Shipment Received from the start (owner 2026-11-11): empty, it says what to do; the done card takes its
    // place right after a Receive.
    function renderShip() {
      const done = !$('shipDone').classList.contains('hidden');
      $('shipArea').classList.toggle('hidden', mode !== 'shipment' || (done && !shipLines.length));
      if (!shipLines.length) {
        const empty = el('div', 'ship-empty');
        empty.append(el('strong', '', 'Scan a ticket from every pack in the box.'),
          el('span', '', 'Each pack shows up here as you scan. Tap Receive when they\'re all on the list.'));
        $('shipList').replaceChildren(empty);
      } else {
        const list = el('div', 'stock-group');
        list.append(...shipLines.map(shipRow));
        $('shipList').replaceChildren(list);
      }
      renderShipBar();
    }

    // The totals line and the Receive bar (also redrawn while a new game's pack size is typed).
    function renderShipBar() {
      const packs = shipPacks();
      const missing = shipLines.filter(needsPrice).length;
      $('shipSum').textContent = !packs ? '' : `${plural(packs, 'Pack')} · ${plural(shipLines.length, 'Game')}`
        + (isOwner && !missing ? ` · ${money(shipValue(shipLines))}` : '');
      const bar = mode === 'shipment' && view === 'scan' && packs > 0 && $('shipDone').classList.contains('hidden');
      $('receiveBar').classList.toggle('hidden', !bar);
      document.body.classList.toggle('has-bulk-bar', bar);
      $('receiveBtn').disabled = missing > 0;
      $('receiveBtn').textContent = missing ? `Pick a Price for ${plural(missing, 'New Game')}` : `Receive ${plural(packs, 'Pack')}`;
    }

    // Receive: the whole shipment at once. Refused (a pack the database already has): nothing is saved, the pack is
    // marked red and the reason shows under the list.
    $('receiveBtn').addEventListener('click', async () => {
      const odd = shipLines.find((l) => !known(l.gameNumber) && STANDARD_PACK_SIZES[Number(l.gamePrice)]
        && Number(l.ticketsPerPack) !== STANDARD_PACK_SIZES[Number(l.gamePrice)]);
      if (odd && !confirm(`Game ${odd.gameNumber}: $${odd.gamePrice} packs usually have ${STANDARD_PACK_SIZES[Number(odd.gamePrice)]} tickets, not ${odd.ticketsPerPack}. Receive anyway?`)) return;
      const lines = shipLines.map((l) => {
        const line = { gameNumber: l.gameNumber, packs: l.packs.length, packNumbers: l.packs.filter(Boolean) };
        if (!known(l.gameNumber)) Object.assign(line, { gamePrice: l.gamePrice, ticketsPerPack: l.ticketsPerPack });
        return line;
      });
      clearShipMessage();
      try {
        const received = shipLines;
        const packs = shipPacks();
        const value = shipValue(received);
        const result = await whileBusy($('receiveBtn'), 'Receiving…', () =>
          api('saveBackStock', { mode: 'shipment', lines, notes: $('notes').value }));
        stock = result.backStock;
        shipLines = [];
        refusedPack = null;
        $('notes').value = '';
        saveDraft();
        showShipDone(received, result.results, packs, value);
        render();
        renderStock();
      } catch (err) {
        const found = /Pack (\d{4}-\d{7})/.exec(err.message);
        refusedPack = found ? found[1] : null;
        render();
        showMessage($('shipMessage'), err.message + (refusedPack ? ' Tap the red pack to take it off, then Receive again.' : ''));
        $('shipMessage').scrollIntoView({ block: 'center' });
      }
    });

    // What was received; the list is empty again for the next shipment.
    function showShipDone(received, results, packs, value) {
      const done = $('shipDone');
      const head = el('div', 'ship-done-head');
      const check = el('span', 'ship-done-check');
      check.innerHTML = icon('check');
      head.append(check, el('h2', '', 'Shipment Received'));
      const sub = el('p', 'sub', `${plural(packs, 'pack')} · ${plural(received.length, 'game')}${isOwner ? ` · ${money(value)}` : ''} added to back stock.`);
      const rows = el('div', 'ship-done-rows');
      for (const r of results) {
        const row = el('div', 'ship-done-row');
        row.append(el('span', 'stock-num mono', r.gameNumber), el('span', 'ship-count', `+${r.after - r.before}`),
          el('span', 'ship-price', `${r.before} → ${r.after} in the back`));
        rows.append(row);
      }
      const again = el('button', 'small', 'Scan Another Shipment');
      again.type = 'button';
      again.addEventListener('click', () => { done.classList.add('hidden'); render(); });
      done.replaceChildren(head, sub, rows, again);
      done.classList.remove('hidden');
      done.scrollIntoView({ block: 'nearest' });
    }

    // --- Full pack sale dialog ---

    let sell = null;   // { game, packNumber } while open

    function openSellDialog(game, packNumber) {
      sell = { game, packNumber };
      const value = game.price * game.ticketsPerPack;
      $('sellPack').textContent = `Game ${game.gameNumber} · Pack ${packNumber}`;
      $('sellValue').textContent = isOwner ? money(value) : `${game.ticketsPerPack} tickets`;
      $('sellMath').textContent = isOwner ? `$${game.price} × ${game.ticketsPerPack} tickets` : '';
      $('sellBack').textContent = `Back: ${game.packsInBack} → ${game.packsInBack - 1}`;
      $('sellDialog').classList.remove('hidden');
    }

    function closeSellDialog() {
      sell = null;
      $('sellDialog').classList.add('hidden');
    }

    $('sellCancel').addEventListener('click', closeSellDialog);

    // Sell: one pack comes off the back at once, and the sale is in today's totals.
    $('sellSave').addEventListener('click', async () => {
      const { game, packNumber } = sell;
      $('sellCancel').disabled = true;
      try {
        const r = await whileBusy($('sellSave'), 'Selling…', () =>
          api('sellFullPack', { gameNumber: game.gameNumber, packNumber }));
        stock = r.backStock;
        closeSellDialog();
        renderStock();
        flash(`Sold full pack ${r.packKey}${isOwner ? ` for ${money(r.dollars)}` : ''}. Game ${r.gameNumber}: ${r.before} → ${r.after} in the back.`);
      } catch (err) {
        closeSellDialog();
        flash(err.message, 'error');
      } finally {
        $('sellCancel').disabled = false;
      }
    });

    // --- Actions ---

    document.querySelectorAll('#modeSwitch button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.mode === mode) return;
      mode = b.dataset.mode;
      $('flash').className = 'message';
      // Each mode keeps its own list, so switching loses nothing. The draft keeps the mode too (never Full pack sale).
      if (mode !== 'fullpack') saveDraft();
      render();
    }));

    $('typedForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('typed').value.trim();
      try {
        if (/^\d{4}$/.test(text)) {
          if (mode === 'fullpack') throw new Error('Type the whole ticket number: the pack number is needed to sell a full pack.');
          addGame(text);
        } else {
          addTicket(parsePrintedTicket(text));
        }
        $('typed').value = '';
      } catch (err) {
        flash(err.message, 'error');
      }
    });

    $('notes').addEventListener('input', saveDraft);
    $('search').addEventListener('input', () => {
      $('stockMessage').className = 'message';
      $('stockMessage').textContent = '';
      renderStock();
    });

    $('clearBtn').addEventListener('click', () => {
      if (!confirm(mode === 'shipment' ? 'Clear this shipment without receiving it?' : 'Clear the list without saving?')) return;
      if (mode === 'shipment') { shipLines = []; refusedPack = null; clearShipMessage(); } else lines = [];
      $('notes').value = '';
      saveDraft();
      render();
    });

    $('saveBtn').addEventListener('click', async () => {
      $('saveMessage').className = 'message';
      const missing = lines.find((l) => l.packs === '' || l.packs == null);
      if (missing) {
        showMessage($('saveMessage'), `Enter the packs for game ${missing.gameNumber}.`);
        focusLine(missing.gameNumber);
        return;
      }
      const odd = lines.find((l) => !known(l.gameNumber) && STANDARD_PACK_SIZES[Number(l.gamePrice)]
        && Number(l.ticketsPerPack) !== STANDARD_PACK_SIZES[Number(l.gamePrice)]);
      if (odd && !confirm(`Game ${odd.gameNumber}: $${odd.gamePrice} packs usually have ${STANDARD_PACK_SIZES[Number(odd.gamePrice)]} tickets, not ${odd.ticketsPerPack}. Save anyway?`)) return;
      try {
        const result = await whileBusy($('saveBtn'), 'Saving…', () =>
          api('saveBackStock', { mode, lines, notes: $('notes').value }));
        stock = result.backStock;
        const summary = result.results.map((r) => `${r.gameNumber}: ${r.before} → ${r.after}`).join(', ');
        lines = [];
        $('notes').value = '';
        saveDraft();
        render();
        renderStock();
        showMessage($('saveMessage'), `${mode === 'shipment' ? 'Shipment' : 'Count'} saved. Packs in the back — ${summary}.`, 'ok');
      } catch (err) {
        showMessage($('saveMessage'), err.message);
      }
    });

    // --- Start ---

    // Last load first (dimmed, buttons off), then the fresh one. Scans and search wait for the fresh one,
    // since they decide from it whether a game is new. A failed load keeps the saved list on screen
    // (dimmed, buttons off) above the reason and a Try again button.
    async function loadStock() {
      try {
        await loadSaved('backstock', () => api('listBackStock'), (data, fresh) => {
          stock = data;
          stockLoaded = fresh;
          render();
          renderStock();
        });
        return true;
      } catch (err) {
        if (!stockLoaded && !document.body.classList.contains('showing-saved')) $('stock').textContent = '';
        // The camera starts once back stock has loaded, so Try again starts it too.
        showLoadError($('loadMessage'), err, async () => {
          if (!(await loadStock())) return false;
          cameraAllowed = true;
          startCamera();
          return true;
        });
        return false;
      }
    }

    async function start() {
      $('viewSwitch').classList.toggle('hidden', !isOwner);
      // Only the modes this person may use; one mode needs no switch.
      document.querySelectorAll('#modeSwitch button').forEach((b) => b.classList.toggle('hidden', !modes.includes(b.dataset.mode)));
      $('modeSwitch').classList.toggle('hidden', modes.length < 2);
      loadDraft();
      // ?mode= opens that mode (Full pack sales page → fullpack; the employee home's links → theirs).
      const asked = new URLSearchParams(location.search).get('mode');
      if (asked in MODE_PERMISSIONS) mode = asked;
      if (!modes.includes(mode)) mode = modes[0];
      // The owner starts on the list, or on Scan when a mode was asked for (Home's links, Full pack sales) or a
      // shipment/count list is waiting to be saved. An employee only has Scan.
      showView(isOwner && !(asked in MODE_PERMISSIONS) && lines.length === 0 && shipLines.length === 0 ? 'stock' : 'scan');
      render();
      if (await loadStock()) {
        cameraAllowed = true;
        startCamera();
      }
    }

    // --- Views (owner): Backstock | Scan. The camera runs only while Scan shows. ---

    let view = 'scan';
    let scanner = null;           // once started
    let cameraStarting = false;
    let cameraAllowed = false;    // back stock has loaded (scans decide from it whether a game is new)
    const scanMode = scanModeSwitch($('scanModeSwitch'), 'smartScanBackStockScanMode', document.getElementById('holdBtn'));
    // No scans while a pop-up is open (Auto Scan would otherwise open the next game over it).
    const popupOpen = () => ['packDialog', 'sellDialog'].some((id) => !$(id).classList.contains('hidden'));

    function showView(next) {
      view = next;
      document.querySelectorAll('#viewSwitch button').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
      $('stockView').classList.toggle('hidden', view !== 'stock');
      $('scanView').classList.toggle('hidden', view !== 'scan');
      renderShipBar();
      if (view === 'scan') startCamera();
      else if (scanner) scanner.stop();
    }
    document.querySelectorAll('#viewSwitch button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.view !== view) showView(b.dataset.view);
    }));

    function startCamera() {
      if (view !== 'scan' || !cameraAllowed) return;
      if (scanner) { scanner.resume(); return; }
      if (cameraStarting) return;
      cameraStarting = true;
      startScanner({
        video: $('video'),
        viewport: $('viewport'),
        holdBtn: $('holdBtn'),
        mode: scanMode.mode,
        paused: popupOpen,
        onStatus: (text) => (text ? flash(text, 'error') : null),
        onScan: (ticket) => addTicket(ticket),
      }).then((s) => {
        scanner = s;
        scanMode.attach(s);
        // Switched back to the list while the camera was opening.
        if (view !== 'scan') s.stop();
      }).catch(cameraError);
    }

    function cameraError(err) { showMessage($('loadMessage'), err.message); }

    if (session) start().catch(cameraError);
  </script>
</body>
</html>
