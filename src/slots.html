<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Slots</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Slots" data-back="index.html" data-back-label="Home" data-back-role="owner"></header>
  <!-- Why the page could not load, with Try again: at the top so it is seen without scrolling. -->
  <div id="loadMessage" class="message"></div>
  <p class="sub" id="hint"></p>

  <div class="segmented" id="boxSwitch">
    <button type="button" data-box="1">Box 1</button>
    <button type="button" data-box="2">Box 2</button>
  </div>
  <div id="summary" class="sub saved-dim"></div>
  <div id="list" class="saved-dim">Loading…</div>

  <nav class="tabbar" data-active="slots"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin();
    // An employee the owner gave Load packs or Return packs to can open a slot too (no $ there).
    const canOpenSlot = ['load_packs', 'return_packs', 'ticket_order'].some((p) => can(session, p));
    if (session) {
      document.getElementById('hint').textContent = session.role === 'owner'
        ? 'Tap a slot to put a new pack in it, end a pack, or change its price.'
        : can(session, 'load_packs') && can(session, 'return_packs') ? 'Tap a slot to mark its pack sold out or returned and put a new pack in.'
          : can(session, 'load_packs') ? 'Tap a slot to mark its pack sold out and put a new pack in.'
            : can(session, 'return_packs') ? 'Tap a slot to mark its pack returned.'
              : 'View only. Packs that sold out are marked during Close Day. Tell the owner when a slot needs a new pack.';
    }

    // From OLD_PACK_DAYS (api.js) on, the owner sees a yellow mark on the slot so the pack gets pushed.

    function daysText(days) {
      if (days === 0) return 'Activated Today';
      return days === 1 ? '1 Day' : `${days} Days`;
    }

    const listEl = document.getElementById('list');
    const summaryEl = document.getElementById('summary');
    const boxButtons = document.querySelectorAll('#boxSwitch button');
    let slots = [];
    let box = Number(new URLSearchParams(location.search).get('box')) === 2 ? 2 : 1;

    function render() {
      boxButtons.forEach((b) => b.classList.toggle('active', Number(b.dataset.box) === box));
      const inBox = slots.filter((s) => s.box === box);
      const empty = inBox.filter((s) => !s.pack).length;
      summaryEl.textContent = `${inBox.length - empty} Live · ${empty} Out of Stock`;

      listEl.innerHTML = '';
      for (const s of inBox) {
        // The owner (and an employee allowed to load or return packs) can open a slot; other employees just see it.
        const card = document.createElement(canOpenSlot ? 'a' : 'div');
        card.className = 'card';
        if (canOpenSlot) card.href = `activate.html?box=${s.box}&slot=${s.slot}`;

        const top = document.createElement('div');
        top.className = 'row';
        const name = document.createElement('span');
        name.className = 'slot-num';
        name.textContent = `Slot ${s.slot} · $${s.slotPrice}`;
        const tag = document.createElement('span');
        tag.className = s.pack ? 'tag live' : 'tag warn';
        tag.textContent = s.pack ? `${s.pack.remaining} Left` : 'Out of Stock';
        // Everyone: an arrow on the right for which way this slot's tickets are sold — the pack's own order,
        // or for an empty slot the order its next pack will have.
        const order = s.pack ? s.pack.order : s.slotOrder;
        const arrow = document.createElement('span');
        arrow.className = 'order-arrow';
        arrow.dataset.order = order;
        arrow.innerHTML = icon(orderIcon(order));
        arrow.title = `${orderName(order)} ticket order`;
        arrow.setAttribute('role', 'img');
        arrow.setAttribute('aria-label', `${orderName(order)} ticket order`);
        const right = document.createElement('div');
        right.className = 'slot-right';
        // Owner only: days since activation in yellow under the tickets left, and a mark on old packs.
        if (session.role === 'owner' && s.pack && s.pack.daysActive != null) {
          const stack = document.createElement('div');
          stack.className = 'tag-stack';
          const days = document.createElement('span');
          days.className = 'tag days';
          days.textContent = daysText(s.pack.daysActive);
          stack.append(tag, days);
          right.append(stack, arrow);
          if (s.pack.daysActive >= OLD_PACK_DAYS) {
            const mark = document.createElement('span');
            mark.className = 'old-mark';
            mark.textContent = '!';
            // It sits on the card's top-left corner, so the slot name isn't pushed right.
            card.classList.add('has-old-mark');
            card.append(mark);
            card.title = `Pack out ${s.pack.daysActive} days. CA Lottery settles packs at 50–60 days.`;
          }
          top.append(name, right);
        } else {
          right.append(tag, arrow);
          top.append(name, right);
        }
        card.append(top);

        if (s.pack) {
          const detail = document.createElement('div');
          detail.className = 'slot-detail';
          detail.innerHTML = '<span class="mono"></span> · ';
          detail.firstChild.textContent = `${s.pack.gameNumber}-${s.pack.packNumber}`;
          detail.append(`top ticket ${String(s.pack.exposedTicket).padStart(3, '0')} · ${s.pack.packsInBack} in back`);
          card.append(detail);
          if (session.role === 'owner') {
            const size = document.createElement('div');
            size.className = 'slot-detail';
            const odd = s.pack.ticketsPerPack !== s.pack.standardPackSize;
            size.textContent = s.pack.ticketsPerPack
              ? `${s.pack.ticketsPerPack} tickets per pack (${s.pack.order === 'ascending' ? `0 to ${s.pack.ticketsPerPack - 1}` : `${s.pack.ticketsPerPack - 1} to 0`})`
              : 'Pack size unknown';
            if (odd) {
              const warn = document.createElement('span');
              warn.className = 'tag warn';
              warn.style.marginLeft = '6px';
              warn.textContent = s.pack.standardPackSize ? `$${s.pack.price} Is Usually ${s.pack.standardPackSize}` : 'Check';
              size.append(warn);
            }
            card.append(size);
          }
        } else {
          if (s.endedToday) {
            const detail = document.createElement('div');
            detail.className = 'slot-detail';
            detail.textContent = `${s.endedToday.reason === 'sold_out' ? 'Sold out' : 'Returned'} today: ${s.endedToday.packKey}`;
            card.append(detail);
          }
          // The game last in this slot is most likely what goes back in: show if the back has any.
          if (s.lastGame) {
            const back = document.createElement('div');
            back.className = 'slot-detail';
            const tag = document.createElement('span');
            tag.className = s.lastGame.packsInBack > 0 ? 'tag live' : 'tag warn';
            tag.textContent = backStockText(s.lastGame.gameNumber, s.lastGame.packsInBack);
            back.append('Last Game Here · ', tag);
            card.append(back);
          }
        }
        listEl.append(card);
      }
    }

    boxButtons.forEach((b) => b.addEventListener('click', () => {
      box = Number(b.dataset.box);
      history.replaceState(null, '', `?box=${box}`);
      render();
    }));

    // Last load first (dimmed), then the fresh one. A tapped slot's page loads its own fresh data.
    // A failed load keeps the saved slots on screen (dimmed) above the reason and a Try again button.
    async function load() {
      try {
        await loadSaved('slots', () => api('listSlots'), (data) => { slots = data; render(); });
        return true;
      } catch (err) {
        if (!slots.length) listEl.textContent = '';
        showLoadError(document.getElementById('loadMessage'), err, load);
        return false;
      }
    }
    if (session) load();
  </script>
</body>
</html>
