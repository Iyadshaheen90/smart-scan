<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Slots</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Slots" data-back="index.html" data-back-label="Home" data-back-role="owner"></header>
  <!-- Why the page could not load, with Try again: at the top so it is seen without scrolling. -->
  <div id="loadMessage" class="message"></div>
  <p class="sub" id="hint"></p>
  <!-- Activate Several (owner 2026-11-10) and Ready to Restock (Pro, owner 2026-11-16; shown when a slot is ready):
       database only, for the owner and employees with Load packs. -->
  <div class="group hidden" id="bulkGroup" style="margin-bottom: 14px;">
    <a class="group-row hidden" href="restock.html" id="restockRow">
      <span class="row-icon accent" data-icon="box"></span>
      <span class="row-text"><span class="row-main"><span class="row-title">Ready to Restock</span><span class="row-sub" id="restockSub"></span></span><span class="tag live" id="restockCount"></span><span class="row-chev" data-icon="chevronRight"></span></span>
    </a>
    <a class="group-row" href="activate-several.html" id="bulkLink">
      <span class="row-icon accent" data-icon="scan"></span>
      <span class="row-text"><span class="row-main"><span class="row-title">Activate Several</span><span class="row-sub">Scan many packs, put them all in at once</span></span><span class="row-chev" data-icon="chevronRight"></span></span>
    </a>
  </div>

  <!-- One button per box the store has (drawBoxSwitch in nav.js); a one-box store has none. -->
  <div class="segmented hidden" id="boxSwitch"></div>
  <div id="summary" class="sub saved-dim"></div>
  <div id="list" class="saved-dim">Loading…</div>

  <!-- Find a Slot (owner 2026-11-20): a quiet floating magnifier, shown once slots are on screen. It opens a full-screen
       search (field at the top, Cancel to close) over the slots already loaded: a game or pack number → which box and
       slot it's in and the tickets left as of the last close. -->
  <button class="find-fab hidden" id="findFab" type="button" aria-label="Find a Slot" title="Find a Slot"><span data-icon="search"></span></button>
  <div class="find-panel hidden" id="findPanel" role="dialog" aria-modal="true" aria-label="Find a Slot">
    <div class="find-panel-inner">
      <div class="find-bar">
        <div class="search-field"><input id="findInput" type="search" inputmode="numeric" autocomplete="off" placeholder="Game or pack number" aria-label="Game or pack number"></div>
        <button class="find-cancel" id="findCancel" type="button">Cancel</button>
      </div>
      <div class="find-sum" id="findSum"></div>
      <div id="findResults"></div>
      <p class="find-hint" id="findHint">Type a game number, like 1747, or a pack number.</p>
    </div>
  </div>

  <nav class="tabbar" data-active="slots"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin();
    // An employee the owner gave Load packs or Return packs to can open a slot too (no $ there).
    const canOpenSlot = ['load_packs', 'return_packs', 'ticket_order'].some((p) => can(session, p));
    if (session) {
      document.getElementById('hint').textContent = session.role === 'owner'
        ? 'Tap a slot to put a new pack in it, end a pack, or change its price.'
        : can(session, 'load_packs') && can(session, 'return_packs') ? 'Tap a slot to mark its pack sold out or returned and put a new pack in.'
          : can(session, 'load_packs') ? 'Tap a slot to mark its pack sold out and put a new pack in.'
            : can(session, 'return_packs') ? 'Tap a slot to mark its pack returned.'
              : 'View only. Packs that sold out are marked during Close Day. Tell the owner when a slot needs a new pack.';
      document.getElementById('bulkGroup').classList.toggle('hidden', !USE_DATABASE || !can(session, 'load_packs'));
      if (USE_DATABASE && can(session, 'load_packs')) {
        api('restockList').then((list) => {
          document.getElementById('restockRow').classList.toggle('hidden', !list.length);
          document.getElementById('restockCount').textContent = list.length;
          document.getElementById('restockSub').textContent = `${list.length === 1 ? '1 empty slot has' : `${list.length} empty slots have`} packs in the back`;
        }).catch(() => {});
      }
    }

    // From OLD_PACK_DAYS (api.js) on, the owner sees a yellow mark on the slot so the pack gets pushed.

    function daysText(days) {
      if (days === 0) return 'Activated Today';
      return days === 1 ? '1 Day' : `${days} Days`;
    }

    const listEl = document.getElementById('list');
    const summaryEl = document.getElementById('summary');
    let slots = [];
    let box = Number(new URLSearchParams(location.search).get('box')) || 1;

    function pickBox(n) {
      box = n;
      history.replaceState(null, '', `?box=${box}`);
      render();
    }

    function render() {
      // A box the store doesn't have (an old link, a removed box): its first box.
      if (slots.length && !slots.some((s) => s.box === box)) box = Math.min(...slots.map((s) => s.box));
      drawBoxSwitch(document.getElementById('boxSwitch'), slots, box, pickBox);
      const inBox = slots.filter((s) => s.box === box);
      const empty = inBox.filter((s) => !s.pack).length;
      summaryEl.textContent = `${inBox.length - empty} Live · ${empty} Out of Stock`;

      listEl.innerHTML = '';
      for (const s of inBox) {
        // The owner (and an employee allowed to load or return packs) can open a slot; other employees just see it.
        const card = document.createElement(canOpenSlot ? 'a' : 'div');
        card.className = 'card';
        if (canOpenSlot) card.href = `activate.html?box=${s.box}&slot=${s.slot}`;

        const top = document.createElement('div');
        top.className = 'row';
        const name = document.createElement('span');
        name.className = 'slot-num';
        name.textContent = `Slot ${s.slot} · $${s.slotPrice}`;
        const tag = document.createElement('span');
        tag.className = s.pack ? 'tag live' : 'tag warn';
        tag.textContent = s.pack ? `${s.pack.remaining} Left` : 'Out of Stock';
        // Everyone: an arrow on the right for which way this slot's tickets are sold — the pack's own order,
        // or for an empty slot the order its next pack will have.
        const order = s.pack ? s.pack.order : s.slotOrder;
        const arrow = document.createElement('span');
        arrow.className = 'order-arrow';
        arrow.dataset.order = order;
        arrow.innerHTML = icon(orderIcon(order));
        arrow.title = `${orderName(order)} ticket order`;
        arrow.setAttribute('role', 'img');
        arrow.setAttribute('aria-label', `${orderName(order)} ticket order`);
        const right = document.createElement('div');
        right.className = 'slot-right';
        // Owner only: days since activation in yellow under the tickets left, and a mark on old packs.
        if (session.role === 'owner' && s.pack && s.pack.daysActive != null) {
          const stack = document.createElement('div');
          stack.className = 'tag-stack';
          const days = document.createElement('span');
          days.className = 'tag days';
          days.textContent = daysText(s.pack.daysActive);
          stack.append(tag, days);
          right.append(stack, arrow);
          if (s.pack.daysActive >= OLD_PACK_DAYS) {
            const mark = document.createElement('span');
            mark.className = 'old-mark';
            mark.textContent = '!';
            // It sits on the card's top-left corner, so the slot name isn't pushed right.
            card.classList.add('has-old-mark');
            card.append(mark);
            card.title = `Pack out ${s.pack.daysActive} days. The lottery settles packs at 50–60 days.`;
          }
          top.append(name, right);
        } else {
          right.append(tag, arrow);
          top.append(name, right);
        }
        card.append(top);

        if (s.pack) {
          const detail = document.createElement('div');
          detail.className = 'slot-detail';
          detail.innerHTML = '<span class="mono"></span> · ';
          detail.firstChild.textContent = `${s.pack.gameNumber}-${s.pack.packNumber}`;
          detail.append(`top ticket ${String(s.pack.exposedTicket).padStart(3, '0')} · ${s.pack.packsInBack} in back`);
          card.append(detail);
          if (session.role === 'owner') {
            const size = document.createElement('div');
            size.className = 'slot-detail';
            const odd = s.pack.ticketsPerPack !== s.pack.standardPackSize;
            size.textContent = s.pack.ticketsPerPack
              ? `${s.pack.ticketsPerPack} tickets per pack (${s.pack.order === 'ascending' ? `0 to ${s.pack.ticketsPerPack - 1}` : `${s.pack.ticketsPerPack - 1} to 0`})`
              : 'Pack size unknown';
            if (odd) {
              const warn = document.createElement('span');
              warn.className = 'tag warn';
              warn.style.marginLeft = '6px';
              warn.textContent = s.pack.standardPackSize ? `$${s.pack.price} Is Usually ${s.pack.standardPackSize}` : 'Check';
              size.append(warn);
            }
            card.append(size);
          }
        } else {
          if (s.endedToday) {
            const detail = document.createElement('div');
            detail.className = 'slot-detail';
            detail.textContent = `${s.endedToday.reason === 'sold_out' ? 'Sold out' : 'Returned'} today: ${s.endedToday.packKey}`;
            card.append(detail);
          }
          // The game last in this slot is most likely what goes back in: show if the back has any.
          if (s.lastGame) {
            const back = document.createElement('div');
            back.className = 'slot-detail';
            const tag = document.createElement('span');
            tag.className = s.lastGame.packsInBack > 0 ? 'tag live' : 'tag warn';
            tag.textContent = backStockText(s.lastGame.gameNumber, s.lastGame.packsInBack);
            back.append('Last Game Here · ', tag);
            card.append(back);
          }
        }
        listEl.append(card);
      }
    }

    // ---- Find a Slot ----
    const findPanel = document.getElementById('findPanel');
    const findInput = document.getElementById('findInput');
    const findResults = document.getElementById('findResults');
    const findSum = document.getElementById('findSum');
    const findHint = document.getElementById('findHint');

    // The button shows only when there are slots to search; with it, the page leaves room so it never covers the last slot.
    function showFindButton() {
      const on = slots.length > 0;
      document.getElementById('findFab').classList.toggle('hidden', !on);
      document.body.classList.toggle('has-fab', on);
    }

    // Digits only, so "1747-0000004", "1747 0000004" and "17470000004" all work. Up to 4 digits: games starting with
    // them, plus (from 3 digits) packs whose number has them. More: the game + pack written together, or a pack number.
    // An empty slot counts when the game last in it matches (most likely what goes back in).
    function findMatches(query) {
      if (!query) return [];
      const packHit = (game, pack) => (query.length > 4 ? `${game}${pack}`.includes(query) || pack.includes(query)
        : query.length >= 3 && pack.includes(query));
      return slots.filter((s) => (s.pack
        ? s.pack.gameNumber.startsWith(query) || packHit(s.pack.gameNumber, s.pack.packNumber)
        : Boolean(s.lastGame) && query.length <= 4 && s.lastGame.gameNumber.startsWith(query)));
    }

    function drawFind() {
      const query = findInput.value.replace(/\D/g, '');
      const found = findMatches(query);
      const severalBoxes = new Set(slots.map((s) => s.box)).size > 1;
      findResults.innerHTML = '';
      const live = found.filter((s) => s.pack);
      const left = live.reduce((sum, s) => sum + s.pack.remaining, 0);
      findSum.textContent = found.length
        ? `${found.length === 1 ? '1 Slot' : `${found.length} Slots`}${live.length ? ` · ${left} Left` : ''}` : '';
      findHint.textContent = !query ? 'Type a game number, like 1747, or a pack number.'
        : found.length ? '' : `No slot has ${query}.`;
      for (const s of found) {
        const card = document.createElement(canOpenSlot ? 'a' : 'div');
        card.className = 'card';
        if (canOpenSlot) card.href = `activate.html?box=${s.box}&slot=${s.slot}`;
        const top = document.createElement('div');
        top.className = 'row';
        const name = document.createElement('span');
        name.className = 'slot-num';
        name.textContent = `${severalBoxes ? `Box ${s.box} · ` : ''}Slot ${s.slot}`;
        const tag = document.createElement('span');
        tag.className = s.pack ? 'tag live' : 'tag warn';
        tag.textContent = s.pack ? `${s.pack.remaining} Left` : 'Out of Stock';
        top.append(name, tag);
        card.append(top);
        const detail = document.createElement('div');
        detail.className = 'slot-detail';
        if (s.pack) {
          detail.innerHTML = '<span class="mono"></span>';
          detail.firstChild.textContent = `${s.pack.gameNumber}-${s.pack.packNumber}`;
          detail.append(` · top ticket ${String(s.pack.exposedTicket).padStart(3, '0')}`);
          const when = document.createElement('div');
          when.className = 'slot-detail';
          const day = planDay(s.pack.lastCloseDate);
          when.textContent = `${day ? `As of the ${day} close` : 'Since it was put in'} · ${s.pack.packsInBack} in back`;
          card.append(detail, when);
        } else {
          detail.textContent = `Last game here: ${s.lastGame.gameNumber} · ${s.lastGame.packsInBack} in back`;
          card.append(detail);
        }
        findResults.append(card);
      }
    }

    function openFind() {
      findPanel.classList.remove('hidden');
      document.documentElement.style.overflow = 'hidden';
      findInput.value = '';
      drawFind();
      findInput.focus();
    }
    function closeFind() {
      findPanel.classList.add('hidden');
      document.documentElement.style.overflow = '';
      findInput.blur();
    }
    document.getElementById('findFab').addEventListener('click', openFind);
    document.getElementById('findCancel').addEventListener('click', closeFind);
    findInput.addEventListener('input', drawFind);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !findPanel.classList.contains('hidden')) closeFind(); });

    // Last load first (dimmed), then the fresh one. A tapped slot's page loads its own fresh data.
    // A failed load keeps the saved slots on screen (dimmed) above the reason and a Try again button.
    async function load() {
      try {
        await loadSaved('slots', () => api('listSlots'), (data) => { slots = data; render(); showFindButton(); if (!findPanel.classList.contains('hidden')) drawFind(); });
        return true;
      } catch (err) {
        if (!slots.length) listEl.textContent = '';
        showLoadError(document.getElementById('loadMessage'), err, load);
        return false;
      }
    }
    if (session) load();
  </script>
</body>
</html>
