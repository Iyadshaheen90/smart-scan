<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Close Day</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Close Day"></header>
  <script>
    // close.html?shift=1 is Close shift (owner's request 2026-09-30): the same scanning screen, for an optional
    // shift close. It saves only that shift's numbers and never changes anything Close Day uses.
    const SHIFT_MODE = new URLSearchParams(location.search).get('shift') === '1';
    if (SHIFT_MODE) {
      document.currentScript.previousElementSibling.dataset.title = 'Close shift';
      document.title = 'Smart Scan — Close shift';
    }
  </script>
  <p class="sub" id="dateLine">Loading…</p>

  <!-- Today is already closed. -->
  <div id="closedView" class="hidden">
    <div class="card" id="summary"></div>
    <button type="button" class="hidden" id="reopenBtn">Reopen today's close to fix it</button>
    <a class="button" href="index.html">Done</a>
  </div>

  <!-- Submitted and saved on this phone, but the server hasn't got it yet. -->
  <div id="pendingView" class="hidden">
    <div class="card">
      <strong>Close saved on this phone. Not sent yet.</strong>
      <div class="slot-detail" id="pendingInfo"></div>
    </div>
    <div id="pendingMessage" class="message"></div>
    <button type="button" class="primary" id="retryBtn">Try sending now</button>
    <button type="button" class="danger" id="cancelPendingBtn">Stop sending and change scans</button>
  </div>

  <!-- Scanning. -->
  <div id="closeView" class="hidden">
    <div class="row"><span id="progressText"></span><span class="tag" id="leftTag"></span></div>
    <div class="progress"><div id="progressBar"></div></div>

    <div class="card current" id="currentCard">
      <div class="current-where" id="curWhere"></div>
      <div class="slot-detail"><span class="mono" id="curPack"></span></div>
      <div class="slot-detail" id="curLast"></div>
      <div class="slot-detail cur-done" id="curDone"></div>
    </div>
    <div class="choices">
      <button type="button" id="soldOutBtn">Sold out</button>
      <button type="button" id="skipBtn">Skip</button>
    </div>

    <div class="scan-viewport paused" id="viewport">
      <video id="video" playsinline muted autoplay></video>
      <div class="scan-guide"></div>
      <!-- On top of the camera picture, above the guide box: it takes no room, so nothing moves between scans
           and the progress bar, the slot card and the scan button all stay in view. -->
      <div id="flash" class="message scan-flash"></div>
    </div>
    <label class="button hold-button" id="holdBtn">Press and hold to scan</label>
    <div class="segmented" id="modeSwitch" style="margin-top: 10px;">
      <button type="button" data-mode="hold">Press and hold</button>
      <button type="button" data-mode="auto">Auto scan</button>
    </div>
    <form id="typedForm">
      <label for="typed">Or type the number printed on the ticket</label>
      <input id="typed" inputmode="numeric" autocomplete="off" placeholder="1747-1263622-4-075">
      <button type="submit">Use this number</button>
    </form>

    <h2>All slots</h2>
    <p class="sub">Tap a slot to go back to it. A new scan replaces the old one.</p>
    <div id="review"></div>
    <button type="button" class="primary" id="submitBtn" disabled>Submit close</button>
    <div id="submitMessage" class="message"></div>
    <button type="button" class="danger hidden" id="clearBtn">Clear all scans and start over</button>
  </div>

  <div id="message" class="message"></div>

  <nav class="tabbar" data-active="scan"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script src="barcode.js"></script>
  <script type="module">
    import { startScanner, haptic, afterLift } from './scanner.js';

    // Scans are kept on this phone until Submit, so they're instant and survive a reload or a
    // dropped connection. The server checks everything again when the close is submitted.
    // Submit saves the close on the phone before sending it; with no connection it waits here
    // and is sent again automatically (see sendPendingClose in api.js).

    const session = requireLogin();
    const isOwner = session && session.role === 'owner';
    const $ = (id) => document.getElementById(id);
    const pad3 = (n) => String(n).padStart(3, '0');
    const keyOf = (s) => `${s.box}-${s.slot}`;
    const packKeyOf = (s) => `${s.pack.gameNumber}-${s.pack.packNumber}`;
    // A shift close has its own draft, so it never mixes with tonight's Close Day scans.
    const DRAFT_KEY = `${SHIFT_MODE ? 'smartScanShiftDraft' : 'smartScanCloseDraft'}:${session ? session.username : ''}`;
    const MODE_KEY = 'smartScanCloseMode';
    // Why a saved close was refused, shown again after the page reloads.
    const REFUSED_KEY = 'smartScanCloseRefused';
    const RETRY_EVERY_MS = 30000;

    let status = null;
    let live = [];          // slots with a pack, box 1 slots 1-24 then box 2 slots 1-24
    let entries = {};       // slot key -> { packKey, type, ticketNumber?, sold }
    let currentKey = null;
    let scanner = null;
    let retryTimer = null;
    let shiftId = null;     // Close shift: made on the first Submit and kept until it's saved, so a resend is saved once
    let mode = 'hold';      // press-and-hold unless this phone was switched to auto
    try { mode = localStorage.getItem(MODE_KEY) === 'auto' ? 'auto' : 'hold'; } catch (e) {}


    // --- Draft kept on the phone ---

    // Close shift: the shift's start point (the previous shift close today, or none), so a draft started
    // before someone else closed a shift isn't used against the new start tickets.
    const draftSince = () => (SHIFT_MODE && status.since ? `${status.since.closedAt} ${status.since.closedBy}` : '');

    function loadDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        if (!draft || draft.date !== status.today || (draft.since || '') !== draftSince()) return {};
        shiftId = draft.shiftId || null;
        // Drop anything for a slot whose pack has changed since it was scanned, and old
        // "no sales" taps (that button was removed; those slots need a real scan).
        return Object.fromEntries(Object.entries(draft.entries).filter(([key, e]) => {
          if (e.type !== 'scan' && e.type !== 'sold_out') return false;
          const slot = live.find((s) => keyOf(s) === key);
          return slot && packKeyOf(slot) === e.packKey && !slot.pack.soldOutAtShift;
        }));
      } catch (e) {
        return {};
      }
    }

    function saveDraft() {
      const kept = Object.fromEntries(Object.entries(entries).filter(([, e]) => e.type !== 'sold_out_earlier'));
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ date: status.today, since: draftSince(), shiftId, entries: kept })); } catch (e) {}
    }

    // Close shift: a pack sold out at an earlier shift close today is filled in as "sold out · 0" (no scan).
    function addEarlierSoldOuts() {
      for (const slot of live) {
        if (slot.pack.soldOutAtShift) entries[keyOf(slot)] = { packKey: packKeyOf(slot), type: 'sold_out_earlier', sold: 0 };
      }
    }

    function clearDraft() {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }

    // --- Moving through the slots ---

    // The next slot without an entry, starting after `fromKey` and wrapping around.
    function nextOpen(fromKey) {
      const start = fromKey ? live.findIndex((s) => keyOf(s) === fromKey) + 1 : 0;
      for (let i = 0; i < live.length; i++) {
        const slot = live[(start + i) % live.length];
        if (!entries[keyOf(slot)]) return keyOf(slot);
      }
      return null;
    }

    // Screen changes from a Press and hold scan wait for the finger to lift (see afterLift in scanner.js).
    const afterRelease = (fn) => afterLift($('holdBtn'), fn);

    function record(slot, entry, note) {
      entries[keyOf(slot)] = { packKey: packKeyOf(slot), ...entry };
      saveDraft();
      const where = `Box ${slot.box} · Slot ${slot.slot}`;
      const what = entry.type === 'sold_out' ? `sold out (${entry.sold} sold${SHIFT_MODE ? ' this shift' : ''})`
        : `${entry.sold} sold`;
      const large = entry.sold >= status.largeSaleTickets ? ' — that is a lot, double-check it' : '';
      currentKey = nextOpen(keyOf(slot));
      afterRelease(() => {
        flash(`${where}: ${what} ✓${note || ''}${large}`, large ? 'error' : 'ok');
        render();
      });
    }

    // Shown on the camera picture; a message too long for its space gets smaller text instead of being cut off.
    function flash(text, kind) {
      const box = $('flash');
      showMessage(box, text, kind);
      box.classList.add('scan-flash');
      box.style.fontSize = '';
      for (let size = 13; box.scrollHeight > box.clientHeight && size >= 10; size--) box.style.fontSize = `${size}px`;
    }

    function useTicket(ticket) {
      const slot = live.find((s) => s.pack.gameNumber === ticket.gameNumber && s.pack.packNumber === ticket.packNumber);
      if (!slot) {
        haptic('error');
        afterRelease(() => flash(`Pack ${ticket.gameNumber}-${ticket.packNumber} isn't in any slot. Not saved.`, 'error'));
        return;
      }
      if (slot.pack.soldOutAtShift) {
        haptic('error');
        afterRelease(() => flash(`Box ${slot.box} · slot ${slot.slot} was marked sold out at the ${slot.pack.soldOutAtShift} shift close. Not saved.`, 'error'));
        return;
      }
      const exposed = slot.pack.exposedTicket;
      if (ticket.ticketNumber > exposed) {
        haptic('error');
        const last = SHIFT_MODE ? "the shift's start ticket" : 'the last top ticket';
        afterRelease(() => flash(`Ticket ${pad3(ticket.ticketNumber)} is above ${last} (${pad3(exposed)}) for box ${slot.box} · slot ${slot.slot}. Scan the ticket on top now. Not saved.`, 'error'));
        return;
      }
      const elsewhere = currentKey && keyOf(slot) !== currentKey ? ` (it belongs to box ${slot.box} · slot ${slot.slot})` : '';
      const sold = exposed - ticket.ticketNumber;
      record(slot, { type: 'scan', ticketNumber: ticket.ticketNumber, sold }, elsewhere);
    }

    // --- Drawing ---

    function render() {
      const done = live.filter((s) => entries[keyOf(s)]).length;
      $('progressText').textContent = `${done} of ${live.length} slots done`;
      $('leftTag').textContent = done === live.length ? 'Ready to submit' : `${live.length - done} left`;
      $('progressBar').style.width = live.length ? `${(100 * done) / live.length}%` : '100%';

      const current = live.find((s) => keyOf(s) === currentKey);
      // The card stays (same size) when every slot is done, so nothing below it moves.
      ['soldOutBtn', 'skipBtn'].forEach((id) => { $(id).disabled = !current; });
      if (current && current.pack.soldOutAtShift) $('soldOutBtn').disabled = true;
      if (!current) {
        $('curWhere').textContent = 'All slots done';
        $('curPack').textContent = '\u00a0'; // a blank line the same height as a pack line
        $('curLast').textContent = `Check the list below, then ${submitLabel()}.`;
        $('curDone').textContent = '';
      } else {
        $('curWhere').textContent = `Box ${current.box} · Slot ${current.slot}`;
        $('curPack').textContent = `$${current.pack.price} · ${packKeyOf(current)}`;
        $('curLast').textContent = current.pack.soldOutAtShift ? `Sold out at the ${current.pack.soldOutAtShift} shift close`
          : `${SHIFT_MODE ? 'Shift start ticket' : 'Last top ticket'} ${pad3(current.pack.exposedTicket)} (${current.pack.remaining} left)`;
        const entry = entries[currentKey];
        $('curDone').textContent = entry && entry.type === 'sold_out_earlier' ? 'Nothing to scan here.'
          : entry ? `Already done: ${describe(entry)}. Scan again to replace it.` : 'Scan the top ticket.';
        fitText($('curDone')); // one line always, smaller text if it's long
      }

      const review = $('review');
      review.innerHTML = '';
      for (const slot of live) {
        const entry = entries[keyOf(slot)];
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'review-row' + (keyOf(slot) === currentKey ? ' active' : '');
        const left = document.createElement('span');
        left.textContent = `B${slot.box} · S${slot.slot} · $${slot.pack.price}`;
        const right = document.createElement('span');
        right.className = entry ? (entry.sold >= status.largeSaleTickets ? 'tag warn' : 'tag live') : 'tag';
        right.textContent = entry ? describe(entry) : 'not done';
        row.append(left, right);
        row.addEventListener('click', () => {
          currentKey = keyOf(slot);
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        review.append(row);
      }

      $('submitBtn').disabled = done !== live.length;
      $('submitBtn').textContent = done === live.length ? submitLabel() : `${submitLabel()} (${live.length - done} left)`;
      $('clearBtn').classList.toggle('hidden', !live.some((s) => entries[keyOf(s)] && entries[keyOf(s)].type !== 'sold_out_earlier'));
    }

    const submitLabel = () => (SHIFT_MODE ? 'Submit shift close' : 'Submit close');

    function describe(entry) {
      if (entry.type === 'sold_out_earlier') return 'sold out · 0';
      if (entry.type === 'sold_out') return `sold out · ${entry.sold}`;
      return `${entry.sold} sold · top ${pad3(entry.ticketNumber)}`;
    }

    function renderClosed(summary) {
      stopCamera();
      $('closeView').classList.add('hidden');
      $('pendingView').classList.add('hidden');
      $('closedView').classList.remove('hidden');
      const lines = [`<strong>Closed for ${summary.date}</strong>`];
      if (summary.closedAt) lines.push(`Submitted at ${summary.closedAt}${summary.closedBy ? ` by ${summary.closedBy}` : ''}`);
      lines.push(`${summary.ticketsSold} tickets sold today`);
      if ('dollarsSold' in summary) {
        lines.push(`$${summary.dollarsSold.toLocaleString()} sold today`);
        lines.push(`Inventory value: $${summary.inventoryValue.toLocaleString()} (live slots + back stock)`);
      }
      lines.push(`${summary.liveSlots} slots live`);
      $('summary').innerHTML = lines.map((l) => `<div>${l}</div>`).join('');
      $('reopenBtn').classList.toggle('hidden', !isOwner);
    }

    // Close shift saved (or this employee's shift close today, shown again). note: an extra line under it.
    function renderShiftDone(shift, note) {
      stopCamera();
      $('closeView').classList.add('hidden');
      $('closedView').classList.remove('hidden');
      $('reopenBtn').classList.add('hidden');
      const lines = [`<strong>Shift closed at ${shift.closedAt} by ${navEscape(shift.closedBy)}</strong>`,
        `From ${shift.since ? `the ${shift.since} shift close` : "last night's close"} to ${shift.closedAt}`,
        `${shift.ticketsSold} tickets sold this shift`];
      if ('dollarsSold' in shift) {
        lines.push(`$${shift.dollarsSold.toLocaleString()} sold this shift`);
        if (shift.endedTickets) {
          lines.push(`Includes ${shift.endedTickets} tickets ($${shift.endedDollars.toLocaleString()}) from packs ended or sold whole during the shift`);
        }
      }
      lines.push("Tonight's Close Day still covers the whole day.");
      if (note) lines.push(note);
      $('summary').innerHTML = lines.map((l) => `<div>${l}</div>`).join('');
    }

    // Close shift isn't possible (the day is closed): just the reason and Done.
    function renderShiftBlocked(text) {
      $('closedView').classList.remove('hidden');
      $('reopenBtn').classList.add('hidden');
      $('summary').textContent = text;
    }

    // --- Sending the close ---

    function stopCamera() {
      const stream = $('video').srcObject;
      if (stream) stream.getTracks().forEach((t) => t.stop());
    }

    function showPending(err) {
      const pending = getPendingClose();
      stopCamera();
      $('closeView').classList.add('hidden');
      $('pendingView').classList.remove('hidden');
      $('dateLine').textContent = pending.date;
      $('pendingInfo').textContent = `All ${pending.entries.length} slots for ${pending.date}. It is sent by itself when the `
        + 'connection is back while this app is open. You can leave this page; opening the app again tries again. '
        + "Don't close the day on another phone.";
      if (err) {
        const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        showMessage($('pendingMessage'), `Last try at ${time}: ${err.message}`);
      }
      if (!retryTimer) retryTimer = setInterval(trySend, RETRY_EVERY_MS);
    }

    function stopRetrying() {
      clearInterval(retryTimer);
      retryTimer = null;
    }

    // Returns true once the close is saved on the server, false while it is still waiting.
    // If the server refuses it, the page reloads (the scans are still in the draft) and says why.
    // A try already running (timer, button, back online) is shared rather than started again.
    let attempt = null;
    function trySend() {
      if (!attempt) attempt = sendOnce().finally(() => { attempt = null; });
      return attempt;
    }

    async function sendOnce() {
      try {
        const summary = await whileBusy($('retryBtn'), 'Sending…', sendPendingClose);
        stopRetrying();
        clearDraft();
        if (summary) {
          renderClosed(summary);
          window.scrollTo({ top: 0 });
        }
        return true;
      } catch (err) {
        if (canRetryClose(err)) {
          showPending(err);
          return false;
        }
        stopRetrying();
        // The page reloads by itself, so the server's "Reload Close Day." isn't needed.
        const message = err.message.replace(' Reload Close Day.', '');
        const why = err.code === 'slots_changed' ? `${message} (Your scans for unchanged slots are kept.)` : message;
        try { sessionStorage.setItem(REFUSED_KEY, `The close wasn't saved: ${why}`); } catch (e) {}
        location.reload();
        return false;
      }
    }

    $('retryBtn').addEventListener('click', () => trySend());
    // Try again as soon as the phone is back online or the app comes back to the front.
    // (Not on Close shift: an unsent Close Day is sent from Close Day and the home page.)
    window.addEventListener('online', () => { if (!SHIFT_MODE && getPendingClose()) trySend(); });
    document.addEventListener('visibilitychange', () => {
      if (!SHIFT_MODE && document.visibilityState === 'visible' && getPendingClose()) trySend();
    });

    $('cancelPendingBtn').addEventListener('click', () => {
      if (!confirm("Stop sending this close? Your scans stay on this phone so you can change them and submit again. If it already reached the server, today is closed and only the owner can reopen it.")) return;
      stopRetrying();
      clearPendingClose();
      location.reload();
    });

    // --- Buttons ---

    const current = () => live.find((s) => keyOf(s) === currentKey);

    $('soldOutBtn').addEventListener('click', () => {
      const slot = current();
      const after = SHIFT_MODE ? ' this shift. The pack stays in the slot until Close Day.' : ', and the slot goes out of stock.';
      if (!confirm(`Box ${slot.box} · Slot ${slot.slot}: pack ${packKeyOf(slot)} is empty? All ${slot.pack.remaining} tickets left count as sold${after}`)) return;
      record(slot, { type: 'sold_out', sold: slot.pack.remaining });
    });
    $('skipBtn').addEventListener('click', () => {
      const next = nextOpen(currentKey);
      currentKey = next && next !== currentKey ? next : currentKey;
      $('flash').className = 'message scan-flash';
      $('flash').textContent = '';
      render();
    });

    // Throws away every scan on this phone (e.g. after a practice run) so tonight's close starts
    // from nothing. Nothing was sent to the server yet, so there is nothing else to undo.
    $('clearBtn').addEventListener('click', () => {
      const done = Object.values(entries).filter((e) => e.type !== 'sold_out_earlier').length;
      if (!confirm(`Clear all ${done} scans on this phone and start the ${SHIFT_MODE ? 'shift close' : 'close'} over? Every slot has to be scanned again. This can't be undone.`)) return;
      entries = {};
      clearDraft();
      addEarlierSoldOuts();
      currentKey = nextOpen(null);
      $('submitMessage').className = 'message';
      $('submitMessage').textContent = '';
      flash('All scans cleared. Start again from the first slot.', 'ok');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('typedForm').addEventListener('submit', (e) => {
      e.preventDefault();
      try {
        useTicket(parsePrintedTicket($('typed').value));
        $('typed').value = '';
      } catch (err) {
        flash(err.message, 'error');
      }
    });

    const modeButtons = document.querySelectorAll('#modeSwitch button');
    function setMode(next) {
      mode = next;
      modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
      if (scanner) scanner.setMode(mode);
      try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    }
    modeButtons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

    $('submitBtn').addEventListener('click', async () => {
      const submitMessage = $('submitMessage');
      submitMessage.className = 'message';
      const payload = live.filter((s) => entries[keyOf(s)].type !== 'sold_out_earlier').map((s) => {
        const e = entries[keyOf(s)];
        return { box: s.box, slot: s.slot, packKey: e.packKey, type: e.type, ticketNumber: e.ticketNumber };
      });
      if (SHIFT_MODE) {
        await whileBusy($('submitBtn'), 'Submitting…', () => submitShift(payload));
        return;
      }
      try {
        savePendingClose({ closeId: newCloseId(), date: status.today, entries: payload });
      } catch (err) {
        showMessage(submitMessage, "This phone couldn't save the close. Try again.");
        return;
      }
      await whileBusy($('submitBtn'), 'Submitting…', trySend);
    });

    // A shift close isn't queued like Close Day: with no connection it says so and the scans stay on the phone.
    async function submitShift(payload) {
      if (!shiftId) shiftId = newCloseId();
      saveDraft();
      try {
        const shift = await api('submitShiftClose', { shiftId, date: status.today, entries: payload });
        clearDraft();
        renderShiftDone(shift);
        window.scrollTo({ top: 0 });
      } catch (err) {
        const why = err.code === 'network' ? "Couldn't reach the server. Your scans are kept on this phone; try Submit again."
          : `The shift close wasn't saved: ${err.message}`;
        showMessage($('submitMessage'), why);
      }
    }

    $('reopenBtn').addEventListener('click', async () => {
      if (!confirm("Reopen today's close? Every slot goes back to its top ticket from before the close, and the day has to be closed again.")) return;
      try {
        await whileBusy($('reopenBtn'), 'Reopening…', () => api('reopenClose'));
        location.reload();
      } catch (err) {
        showMessage($('message'), err.message);
      }
    });

    // --- Start ---

    async function start() {
      let refused = null;
      try {
        refused = sessionStorage.getItem(REFUSED_KEY);
        sessionStorage.removeItem(REFUSED_KEY);
      } catch (e) {}
      if (SHIFT_MODE) {
        // Not the Close Day tab.
        document.querySelectorAll('nav.tabbar a.active').forEach((a) => a.classList.remove('active'));
        status = await api('shiftStatus');
        $('dateLine').textContent = `${status.today} · since ${status.since
          ? `the ${status.since.closedAt} shift close by ${status.since.closedBy}` : "last night's close"}`;
        if (status.dayClosed) {
          renderShiftBlocked("Today is already closed, so there's no shift left to close. Shift closes are for before tonight's Close Day.");
          return;
        }
        if (status.myShiftToday) {
          renderShiftDone(status.myShiftToday, 'You can close one shift a day. If this one was a mistake, ask the owner to delete it.');
          return;
        }
      } else {
        // A close submitted earlier that hasn't reached the server yet: send it before anything else.
        if (getPendingClose()) {
          showPending();
          if (await trySend()) return;
          if (getPendingClose()) return;
        }

        status = await api('closeStatus');
        $('dateLine').textContent = status.today;
        if (status.closed) {
          renderClosed(status.closed);
          if (refused) showMessage($('message'), refused);
          return;
        }
      }
      live = status.slots.filter((s) => s.pack).sort((a, b) => a.box - b.box || a.slot - b.slot);
      entries = loadDraft();
      addEarlierSoldOuts();
      currentKey = nextOpen(null);
      $('closeView').classList.remove('hidden');
      render();
      if (refused) flash(refused, 'error');
      setMode(mode);

      scanner = await startScanner({
        video: $('video'),
        viewport: $('viewport'),
        holdBtn: $('holdBtn'),
        mode,
        onStatus: (text) => (text ? afterRelease(() => flash(text, 'error')) : null),
        onScan: useTicket,
      });
      setMode(mode);
    }

    if (session) start().catch((err) => { $('dateLine').textContent = ''; showMessage($('message'), err.message); });
  </script>
</body>
</html>
