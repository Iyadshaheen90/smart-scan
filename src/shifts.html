<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Shift Closure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Shift Closure" data-back="index.html" data-back-label="Home"></header>
  <p class="sub">Shift closes this month, newest first, to compare with the register. Each counts from the shift
    close before it that day (or last night's close). Close Day still covers the whole day.</p>

  <!-- Floats above the bar: choosing several can leave you far down the page, away from the top. -->
  <div class="toast-wrap" aria-live="polite"><div id="message" class="message"></div></div>
  <div id="list" class="saved-dim saved-lock"></div>

  <nav class="tabbar" data-active=""></nav>
  <!-- While choosing several to delete, this takes the tab bar's place. -->
  <div id="selectBar" class="select-bar hidden">
    <button type="button" class="small" id="selectCancel">Cancel</button>
    <span class="select-count" id="selectCount"></span>
    <button type="button" class="small danger" id="selectDelete">Delete</button>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin('owner');
    const $ = (id) => document.getElementById(id);
    const money = (n) => `$${Math.round(Number(n) || 0).toLocaleString('en-US')}`;
    const pad3 = (n) => String(n).padStart(3, '0');
    let shifts = [];             // the list on screen
    let selecting = false;       // choosing several to delete
    const chosen = new Set();    // their shiftIds

    // "2026-10-05" -> "Mon, Oct 5"
    function dayName(label) {
      const [y, m, d] = label.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function stat(value, label) {
      const box = el('div', 'stat');
      box.append(el('div', 'stat-value fit', value), el('div', 'stat-label', label));
      return box;
    }

    // One line per slot (or pack ended during the shift): where, which pack, and what sold.
    function rowText(r) {
      const where = r.box == null ? 'From the Back' : `Box ${r.box} · Slot ${r.slot}`;
      const what = {
        scan: () => `${pad3(r.start)} → ${pad3(r.end)}`,
        sold_out: () => `${pad3(r.start)} → sold out`,
        sold_out_earlier: () => 'sold out at an earlier shift close',
        ended_sold_out: () => 'marked sold out during the shift',
        ended_returned: () => `returned at ${pad3(r.end)} during the shift`,
        full_pack: () => 'full pack sold',
      }[r.type];
      return [`${where} · ${r.packKey}`, `${what ? what() : r.type} · ${r.sold} sold · ${money(r.dollars)}`];
    }

    function shiftCard(shift) {
      const card = el('div', 'card shift-card');
      card.dataset.shiftId = shift.shiftId;
      const top = el('div', 'row');
      const who = el('span', 'shift-who');
      const mark = el('span', 'select-mark');
      mark.innerHTML = icon('check');
      who.append(mark, el('span', 'slot-num', `${shift.closedBy} · ${shift.closedAt}`));
      top.append(who, el('span', 'chip green', money(shift.dollarsSold)));
      const from = shift.since ? `the ${shift.since} shift close` : "last night's close";
      const stats = el('div', 'stat-grid');
      stats.append(stat(String(shift.ticketsSold), 'Tickets Sold'), stat(money(shift.dollarsSold), 'Sold'),
        stat(String(shift.slotsScanned), 'Slots Scanned'));
      card.append(top, el('div', 'slot-detail', `From ${from} to ${shift.closedAt}`), stats);
      if (shift.endedTickets) {
        card.append(el('div', 'slot-detail', `Includes ${shift.endedTickets} tickets (${money(shift.endedDollars)}) from packs ended or sold whole during the shift.`));
      }

      // Tap to see every slot's start → end ticket.
      const details = el('details');
      details.style.marginTop = '12px';
      details.append(el('summary', null, `Slots (${shift.rows.length})`));
      for (const r of shift.rows) {
        const [left, right] = rowText(r);
        const line = el('div', 'slot-detail');
        line.style.marginTop = '10px';
        line.append(el('div', 'mono', left), el('div', null, right));
        details.append(line);
      }
      card.append(details);

      const del = el('button', 'small danger shift-delete', 'Delete');
      del.type = 'button';
      del.style.marginTop = '12px';
      del.addEventListener('click', () => deleteShift(shift, del));
      card.append(del);
      card.addEventListener('click', () => {
        if (!selecting || busy) return;
        if (chosen.has(shift.shiftId)) chosen.delete(shift.shiftId); else chosen.add(shift.shiftId);
        showChoice();
      });
      return card;
    }

    function showShifts(data) {
      shifts = data.shifts;
      const list = $('list');
      list.innerHTML = '';
      if (shifts.length === 0) list.append(el('p', 'sub', 'No shift closes this month yet.'));
      let day = null;
      for (const shift of shifts) {
        if (shift.date !== day) {
          const label = el('div', 'section-label', dayName(shift.date));
          // The first day's row also holds Select; with only one shift close there is nothing to choose between.
          if (day === null && shifts.length > 1) {
            const row = el('div', 'section-row');
            const toggle = el('button', 'small text-action');
            toggle.type = 'button';
            toggle.id = 'selectToggle';
            toggle.addEventListener('click', selectToggle);
            row.append(label, toggle);
            list.append(row);
          } else {
            list.append(label);
          }
          day = shift.date;
        }
        list.append(shiftCard(shift));
      }
      setSelecting(selecting && shifts.length > 1);
      fitNumbers();
    }

    let busy = false;   // a delete is on its way

    // The floating message fades by itself, like Manage Employees'; a problem stays longer.
    let messageTimer = null;
    function floatMessage(text, kind) {
      showMessage($('message'), text, kind);
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => { $('message').className = 'message'; $('message').textContent = ''; }, kind === 'ok' ? 5000 : 9000);
    }

    function setSelecting(on) {
      selecting = on;
      if (!on) chosen.clear();
      // Keep only what's still on the list (a fresh answer may have fewer).
      for (const id of [...chosen]) if (!shifts.some((s) => s.shiftId === id)) chosen.delete(id);
      document.body.classList.toggle('selecting', on);
      $('selectBar').classList.toggle('hidden', !on);
      showChoice();
    }

    // Draws the current choice: the marks, the count, Delete, and Select / Select All / Deselect All.
    function showChoice() {
      document.querySelectorAll('.shift-card').forEach((card) => {
        const on = chosen.has(card.dataset.shiftId);
        card.classList.toggle('selected', selecting && on);
        if (selecting) card.setAttribute('aria-pressed', String(on)); else card.removeAttribute('aria-pressed');
      });
      const toggle = $('selectToggle');
      if (toggle) toggle.textContent = !selecting ? 'Select' : chosen.size === shifts.length ? 'Deselect All' : 'Select All';
      $('selectCount').textContent = chosen.size ? `${chosen.size} Selected` : 'Select Shifts';
      $('selectDelete').disabled = busy || chosen.size === 0;
      $('selectCancel').disabled = busy;
    }

    function selectToggle() {
      if (busy) return;
      if (!selecting) return setSelecting(true);
      if (chosen.size === shifts.length) chosen.clear(); else shifts.forEach((s) => chosen.add(s.shiftId));
      showChoice();
    }

    // Names each one, so a whole month isn't deleted by a slip; a long list ends in "and N more".
    function chosenText(picked) {
      const lines = picked.slice(0, 5).map((s) => `${s.closedBy}, ${s.closedAt}, ${dayName(s.date)}`);
      if (picked.length > 5) lines.push(`and ${picked.length - 5} more`);
      return lines.join('\n');
    }

    // All together in one request, so they can't half delete. Same result as Delete on each one.
    async function deleteChosen() {
      const picked = shifts.filter((s) => chosen.has(s.shiftId));
      if (!picked.length || busy) return;
      if (!confirm(`Delete ${picked.length} shift close${picked.length === 1 ? '' : 's'}? This can't be undone.\n\n${chosenText(picked)}`)) return;
      busy = true;
      showChoice();
      try {
        const data = await whileBusy($('selectDelete'), 'Deleting…', () => api('deleteShiftClose', { shiftIds: picked.map((s) => s.shiftId) }));
        busy = false;
        selecting = false;
        showShifts(data);
        floatMessage(`Deleted ${picked.length} shift close${picked.length === 1 ? '' : 's'}.`, 'ok');
      } catch (err) {
        busy = false;
        showChoice();
        floatMessage(err.message);
        // They were already deleted elsewhere: show the list as it is now.
        if (err.code === 'nothing_to_delete') { selecting = false; load(); }
      }
    }

    $('selectCancel').addEventListener('click', () => { if (!busy) setSelecting(false); });
    $('selectDelete').addEventListener('click', deleteChosen);

    // For a shift close made by mistake: later shift closes that day then start from the one before it,
    // and an employee can close their shift again.
    async function deleteShift(shift, button) {
      if (!confirm(`Delete ${shift.closedBy}'s shift close at ${shift.closedAt} on ${dayName(shift.date)}? This can't be undone.`)) return;
      try {
        const data = await whileBusy(button, 'Deleting…', () => api('deleteShiftClose', { shiftId: shift.shiftId }));
        showShifts(data);
        floatMessage(`Deleted ${shift.closedBy}'s shift close at ${shift.closedAt}.`, 'ok');
      } catch (err) {
        floatMessage(err.message);
      }
    }

    async function load() {
      try {
        await loadSaved('shifts', () => api('listShiftCloses'), showShifts);
      } catch (err) {
        floatMessage(err.message);
      }
    }
    if (session) load();
  </script>
</body>
</html>
