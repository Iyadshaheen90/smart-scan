<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Shipments received</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="header" data-title="Shipments Received" data-back="reports.html" data-back-label="Reports"></header>
  <script>
    // ?date=2026-10-06 shows that day's games in a table; its back pill returns to the list of days (owner 2026-10-13).
    const DAY = new URLSearchParams(location.search).get('date');
    if (DAY) Object.assign(document.getElementById('header').dataset, { back: 'shipments.html', backLabel: 'Shipments Received' });
  </script>
  <div id="loadMessage" class="message"></div>
  <p class="sub" id="intro">Packs received this month, by the day they were scanned in. Tap a day to see its games.
    The list starts empty each month.</p>
  <h2 id="dayTitle" class="hidden"></h2>

  <div class="status-card saved-dim" id="totals">
    <div class="stat-grid two">
      <div class="stat"><div class="stat-value fit" id="packCount">…</div><div class="stat-label" id="packLabel">Packs This Month</div></div>
      <div class="stat"><div class="stat-value fit" id="dollarCount">…</div><div class="stat-label">Total Value</div></div>
    </div>
  </div>

  <div id="list" class="saved-dim"></div>

  <nav class="tabbar" data-active="reports"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin('owner');
    const $ = (id) => document.getElementById(id);
    const money = (n) => `$${Math.round(Number(n) || 0).toLocaleString('en-US')}`;
    const count = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

    // "2026-10-05" -> "Mon, Oct 5"
    function dayName(label) {
      const [y, m, d] = label.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    const sum = (lines, field) => lines.reduce((total, l) => total + l[field], 0);

    // The lines of each day, newest day first (lines come newest first).
    function byDay(lines) {
      const days = [];
      lines.forEach((line) => {
        let day = days.find((d) => d.date === line.date);
        if (!day) days.push(day = { date: line.date, lines: [] });
        day.lines.push(line);
      });
      return days;
    }

    // One card per day: games, packs and their value; tapping it opens that day's table.
    function dayCard(day) {
      const card = el('a', 'card report-day');
      card.href = `shipments.html?date=${day.date}`;
      const top = el('div', 'row');
      top.append(el('span', 'slot-num', dayName(day.date)), el('span', 'chip green', money(sum(day.lines, 'dollars'))));
      const games = new Set(day.lines.map((l) => l.gameNumber)).size;
      const detail = el('div', 'slot-detail', `${count(games, 'Game')} · ${count(sum(day.lines, 'packs'), 'Pack')}`);
      detail.append(el('span', 'chev', null));
      detail.lastChild.dataset.icon = 'chevronRight';
      card.append(top, detail);
      return card;
    }

    // That day's games numbered 1 to N. Packs added with + in Manage Packs are marked under the game number.
    function dayTable(lines) {
      const table = el('table', 'report-table');
      const head = el('tr');
      ['#', 'Game', 'Packs', 'Ticket Price', 'Pack Size', 'Total Value'].forEach((h) => head.append(el('th', null, h)));
      table.append(el('thead'), el('tbody'), el('tfoot'));
      table.tHead.append(head);
      lines.forEach((line, i) => {
        const row = el('tr');
        const game = el('td', 'mono', line.gameNumber);
        if (line.addedByHand) game.append(el('div', 'cell-note', 'Added by Hand'));
        row.append(el('td', 'num-col', String(i + 1)), game, el('td', null, String(line.packs)),
          el('td', null, money(line.price)), el('td', null, String(line.ticketsPerPack)), el('td', null, money(line.dollars)));
        table.tBodies[0].append(row);
      });
      const total = el('tr');
      total.append(el('td'), el('td', null, 'Total'), el('td', null, String(sum(lines, 'packs'))), el('td'), el('td'),
        el('td', null, money(sum(lines, 'dollars'))));
      table.tFoot.append(total);
      const card = el('div', 'card table-card');
      card.append(table);
      return card;
    }

    function show(data) {
      const list = $('list');
      list.innerHTML = '';
      if (DAY) {
        const lines = data.lines.filter((l) => l.date === DAY);
        $('intro').classList.add('hidden');
        $('dayTitle').classList.remove('hidden');
        $('dayTitle').textContent = dayName(DAY);
        $('packLabel').textContent = 'Packs This Day';
        $('packCount').textContent = count(sum(lines, 'packs'), 'Pack');
        $('dollarCount').textContent = money(sum(lines, 'dollars'));
        if (lines.length === 0) list.append(el('p', 'sub', 'Nothing received on this day.'));
        else list.append(dayTable(lines));
      } else {
        $('packCount').textContent = count(data.packs, 'Pack');
        $('dollarCount').textContent = money(data.dollars);
        if (data.lines.length === 0) list.append(el('p', 'sub', 'No shipments received this month yet.'));
        byDay(data.lines).forEach((day) => list.append(dayCard(day)));
        fillIcons();
      }
      fitNumbers();
    }

    async function load() {
      try {
        await loadSaved('shipments', () => api('listShipments'), show);
        return true;
      } catch (err) {
        showLoadError($('loadMessage'), err, load);
        return false;
      }
    }
    if (session) load();
  </script>
</body>
</html>
