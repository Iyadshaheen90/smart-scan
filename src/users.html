<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Employees</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Employees" data-help="employees"></header>
  <!-- Redesign (owner 2026-10-29): a short intro, Add Employee as one button that opens a pop-up, a clean card per
       person (initials, name, email, status chip, actions, folded permissions). -->
  <p class="sub">Everyone can close the day and view Slots. Turn on more for each person below; employees never see dollar amounts.</p>
  <button type="button" class="primary add-member" id="addOpen"><span data-icon="plus"></span>Add Employee</button>

  <!-- Saves and errors float above the tab bar and fade (a message above the list would move the switches under the
       finger). -->
  <div class="toast-wrap" aria-live="polite"><div id="listMessage" class="message"></div></div>
  <div id="list">Loading…</div>

  <div id="addDialog" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <form id="addForm" class="dialog form-dialog">
    <div class="dialog-title" id="addTitle">Add an Employee</div>
    <label for="username">Username</label>
    <input id="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <div id="passwordField">
      <label for="password">Starting Password</label>
      <input id="password" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" minlength="8" required>
      <ul class="password-rule"></ul>
    </div>
    <div id="emailField" class="hidden">
      <label for="email">Email</label>
      <input id="email" type="email" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <p class="sub">They get an email with a link to choose their own password and sign in with this email.</p>
    </div>
    <div id="addMessage" class="message"></div>
    <div class="dialog-buttons">
      <button type="button" class="cancel" id="addCancel">Cancel</button>
      <button type="submit" class="save">Add Employee</button>
    </div>
  </form>
  </div>

  <nav class="tabbar" data-active="more"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin('owner');

    const listEl = document.getElementById('list');
    const listMessage = document.getElementById('listMessage');
    const addForm = document.getElementById('addForm');
    const addMessage = document.getElementById('addMessage');
    document.querySelectorAll('.password-rule').forEach((el) => showPasswordRule(el));

    // The database adds an employee by email (an invite), not with a starting password.
    if (USE_DATABASE) {
      document.getElementById('passwordField').classList.add('hidden');
      addForm.password.required = false;
      document.getElementById('emailField').classList.remove('hidden');
      addForm.email.required = true;
    }

    // The permissions the owner can turn on per employee (same names as PERMISSIONS on the server). One short line
    // each (redesign 2026-10-29); Help & FAQ → Employees has the longer answer.
    const PERMISSIONS = [
      { key: 'load_packs', name: 'Load Packs', what: 'Sold out and new packs in slots; undo a wrong slot.' },
      { key: 'return_packs', name: 'Return Packs', what: 'Mark a pack returned, or put it back.' },
      { key: 'receive_shipments', name: 'Receive Shipments', what: 'Scan in deliveries (no back stock list).' },
      { key: 'count_stock', name: 'Manage Stock', what: 'Count the back and set how many packs are there.' },
      { key: 'full_pack_sale', name: 'Full Pack Sale', what: 'Sell a sealed pack from the back.' },
      { key: 'ticket_order', name: 'Ticket Order', what: 'Set ↓ or ↑ on empty slots, or all slots at once.' },
      { key: 'theft_report', name: 'Theft Report', what: 'Make the Theft Report, without dollar amounts.' },
    ];

    // Employees whose Permissions list is open, so it stays open when the list is redrawn after a save.
    const openPermissions = new Set();

    // Each switch saves at once; the list comes back from the server, so the screen shows what's saved.
    // The switches fold away under "Permissions · N of 7 on" (closed at first, owner 2026-10-08), so the
    // page stays short with many employees.
    function permissionsBox(user) {
      const box = document.createElement('details');
      box.className = 'perm-details';
      box.open = openPermissions.has(user.username);
      box.addEventListener('toggle', () => {
        if (box.open) openPermissions.add(user.username); else openPermissions.delete(user.username);
      });
      const on = new Set(user.permissions || []);
      const summary = document.createElement('summary');
      const count = PERMISSIONS.filter((p) => on.has(p.key)).length;
      summary.innerHTML = '<span class="grow"></span><span class="tag"></span><span class="perm-chev" data-icon="chevronRight"></span>';
      summary.children[0].textContent = 'Permissions';
      summary.children[1].textContent = count ? `${count} of ${PERMISSIONS.length} On` : 'None On';
      if (count) summary.children[1].classList.add('live');
      summary.children[2].innerHTML = icon('chevronRight');
      box.append(summary);
      const switches = [];
      const save = async (changed, wanted) => {
        listMessage.className = 'message';
        switches.forEach((s) => { s.disabled = true; });
        try {
          const users = await api('setUserPermissions', { username: user.username, permissions: wanted });
          render(users);
          showMessage(listMessage, `${user.username}: ${changed}. It applies the next time their app loads a page.`, 'ok');
        } catch (err) {
          render(lastUsers);
          showMessage(listMessage, err.message);
        }
      };
      for (const p of PERMISSIONS) {
        const row = document.createElement('label');
        row.className = 'perm-row';
        const text = document.createElement('span');
        text.className = 'grow';
        const name = document.createElement('strong');
        name.textContent = p.name;
        const what = document.createElement('span');
        what.className = 'slot-detail';
        what.textContent = p.what;
        text.append(name, what);
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'toggle';
        input.checked = on.has(p.key);
        input.disabled = !user.active;
        input.setAttribute('aria-label', `${p.name} for ${user.username}`);
        input.addEventListener('change', () => {
          const wanted = PERMISSIONS.map((x) => x.key).filter((k) => (k === p.key ? input.checked : on.has(k)));
          save(`${p.name} turned ${input.checked ? 'on' : 'off'}`, wanted);
        });
        switches.push(input);
        row.append(text, input);
        box.append(row);
      }
      // Turn everything on (e.g. before travelling) or off again in one tap.
      const allOn = on.size === PERMISSIONS.length;
      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'small perm-all';
      all.textContent = allOn ? 'Turn All Off' : 'Turn All On';
      all.disabled = !user.active;
      all.addEventListener('click', () => save(allOn ? 'everything turned off' : 'everything turned on',
        allOn ? [] : PERMISSIONS.map((x) => x.key)));
      switches.push(all);
      box.append(all);
      return box;
    }

    let lastUsers = [];
    function render(users) {
      lastUsers = users;
      listEl.innerHTML = '';
      for (const user of users) {
        const card = document.createElement('div');
        card.className = 'card member-card' + (user.active ? '' : ' inactive');

        // Initials, name (and email), and a status chip: Owner green, Invited amber, Inactive red.
        const top = document.createElement('div');
        top.className = 'member-top';
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.textContent = initials(user.username);
        const who = document.createElement('div');
        who.className = 'member-who';
        const name = document.createElement('strong');
        name.textContent = user.username;
        who.append(name);
        if (user.email) {
          const email = document.createElement('div');
          email.className = 'slot-detail';
          email.textContent = user.email;
          who.append(email);
        }
        const tag = document.createElement('span');
        tag.className = 'tag';
        // "Employee", "Owner · Inactive"
        const role = user.role.charAt(0).toUpperCase() + user.role.slice(1);
        tag.textContent = user.active ? role : `${role} · Inactive`;
        if (!user.active) tag.classList.add('warn');
        else if (user.role === 'owner') tag.classList.add('live');
        // Database: invited but hasn't chosen a password and signed in yet.
        if (user.active && user.signedIn === false) {
          tag.textContent = `${role} · Invited`;
          tag.classList.add('days');
        }
        top.append(avatar, who, tag);
        card.append(top);

        if (user.username !== session.username) {
          const actions = document.createElement('div');
          actions.className = 'member-actions';
          actions.append(
            actionButton(user.active ? 'Deactivate' : 'Reactivate', () => {
              if (user.active && !confirm(`Deactivate ${user.username}? They'll be signed out and can't sign in until reactivated.`)) return null;
              return api('setUserActive', { username: user.username, active: !user.active });
            }),
            // Database: someone who hasn't used their invite yet can get a new one (the link works 24 hours).
            ...(user.active && user.signedIn === false ? [actionButton('Resend Invite', () => api('resendInvite', { username: user.username })
              .then((users) => { showMessage(listMessage, `A new invite is on its way to ${user.email}. The old link no longer works.`, 'ok'); return users; }))] : []),
            actionButton('Reset Password', () => {
              const newPassword = prompt(`New password for ${user.username}.\n${PASSWORD_RULE}.`);
              if (!newPassword) return null;
              checkNewPassword(newPassword);
              return api('resetPassword', { username: user.username, newPassword })
                .then((users) => { showMessage(listMessage, `Password for ${user.username} changed. Tell them the new one.`, 'ok'); return users; });
            }),
          );
          card.append(actions);
          if (user.role !== 'owner') card.append(permissionsBox(user));
        }
        listEl.append(card);
      }
    }

    function actionButton(label, run) {
      const button = document.createElement('button');
      button.className = 'small';
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', async () => {
        listMessage.className = 'message';
        listMessage.textContent = '';
        try {
          const users = await whileBusy(button, '…', run);
          if (users) render(users);
        } catch (err) {
          showMessage(listMessage, err.message);
        }
      });
      return button;
    }

    // The floating message goes away by itself (5 s, an error 9 s) or when tapped.
    let toastTimer = null;
    const hideToast = () => { listMessage.className = 'message'; listMessage.textContent = ''; };
    new MutationObserver(() => {
      clearTimeout(toastTimer);
      if (listMessage.textContent) toastTimer = setTimeout(hideToast, listMessage.classList.contains('error') ? 9000 : 5000);
    }).observe(listMessage, { childList: true, characterData: true, subtree: true, attributes: true });
    listMessage.addEventListener('click', hideToast);

    // Add Employee opens the pop-up; Cancel closes it and keeps nothing.
    const addDialog = document.getElementById('addDialog');
    function closeAdd() {
      addDialog.classList.add('hidden');
      addForm.reset();
      addMessage.className = 'message';
      addMessage.textContent = '';
      addForm.password.dispatchEvent(new Event('input'));
    }
    document.getElementById('addOpen').addEventListener('click', () => {
      addDialog.classList.remove('hidden');
      addForm.username.focus();
    });
    document.getElementById('addCancel').addEventListener('click', closeAdd);

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const username = addForm.username.value;
        const email = addForm.email.value.trim();
        if (!USE_DATABASE) checkNewPassword(addForm.password.value);
        const users = await whileBusy(addForm.querySelector('button[type="submit"]'), 'Adding…', () => api('createUser', USE_DATABASE
          ? { username, email }
          : { username, password: addForm.password.value, role: 'employee' }));
        render(users);
        closeAdd();
        showMessage(listMessage, USE_DATABASE
          ? `Added ${username.trim().toLowerCase()}. An invite is on its way to ${email}. If it doesn't arrive, tap Reset Password on their card to give them a password.`
          : `Added ${username.trim().toLowerCase()}.`, 'ok');
      } catch (err) {
        showMessage(addMessage, err.message);
      }
    });

    if (session) {
      api('listUsers').then(render).catch((err) => { listEl.textContent = ''; showMessage(listMessage, err.message); });
    }
  </script>
</body>
</html>
