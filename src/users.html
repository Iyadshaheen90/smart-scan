<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Employees</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Employees"></header>
  <p class="sub">Employees can close the day (marking packs sold out as they go) and view the slots. Anything more is off until you turn it on for that employee below (for example while you're away), and they never see dollar amounts.</p>

  <div id="list">Loading…</div>
  <div id="listMessage" class="message"></div>

  <h2>Add an Employee</h2>
  <form id="addForm">
    <label for="username">Username</label>
    <input id="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="password">Starting Password</label>
    <input id="password" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" minlength="6" required>
    <button class="primary" type="submit">Add Employee</button>
  </form>
  <div id="addMessage" class="message"></div>

  <nav class="tabbar" data-active="more"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin('owner');

    const listEl = document.getElementById('list');
    const listMessage = document.getElementById('listMessage');
    const addForm = document.getElementById('addForm');
    const addMessage = document.getElementById('addMessage');

    // The permissions the owner can turn on per employee (same names as PERMISSIONS on the server).
    const PERMISSIONS = [
      { key: 'load_packs', name: 'Load Packs', what: 'Mark a pack sold out and put a new pack in a slot, including a new game or a slot price change to fit it. Can undo a wrong slot and put back a pack marked sold out by mistake.' },
      { key: 'return_packs', name: 'Return Packs', what: 'Mark a pack returned (scan its top ticket).' },
      { key: 'receive_shipments', name: 'Receive Shipments', what: 'Scan in a delivery on Back stock. Only the shipment scanner, not the back stock list.' },
      { key: 'count_stock', name: 'Manage Stock', what: 'Count the back and set how many packs are there.' },
      { key: 'full_pack_sale', name: 'Full Pack Sale', what: 'Sell a sealed pack from the back.' },
      { key: 'ticket_order', name: 'Ticket Order', what: 'Set a slot to descending or ascending while it\'s empty (slot page), or all slots at once (More).' },
    ];

    // Employees whose Permissions list is open, so it stays open when the list is redrawn after a save.
    const openPermissions = new Set();

    // Each switch saves at once; the list comes back from the server, so the screen shows what's saved.
    // The switches fold away under "Permissions · N of 6 on" (closed at first, owner 2026-10-08), so the
    // page stays short with many employees.
    function permissionsBox(user) {
      const box = document.createElement('details');
      box.className = 'perm-details';
      box.open = openPermissions.has(user.username);
      box.addEventListener('toggle', () => {
        if (box.open) openPermissions.add(user.username); else openPermissions.delete(user.username);
      });
      const on = new Set(user.permissions || []);
      const summary = document.createElement('summary');
      const count = PERMISSIONS.filter((p) => on.has(p.key)).length;
      summary.innerHTML = '<span class="grow"></span><span class="tag"></span><span class="perm-chev" data-icon="chevronRight"></span>';
      summary.children[0].textContent = 'Permissions';
      summary.children[1].textContent = count ? `${count} of ${PERMISSIONS.length} On` : 'None On';
      if (count) summary.children[1].classList.add('live');
      summary.children[2].innerHTML = icon('chevronRight');
      box.append(summary);
      const switches = [];
      const save = async (changed, wanted) => {
        listMessage.className = 'message';
        switches.forEach((s) => { s.disabled = true; });
        try {
          const users = await api('setUserPermissions', { username: user.username, permissions: wanted });
          render(users);
          showMessage(listMessage, `${user.username}: ${changed}. It applies the next time their app loads a page.`, 'ok');
        } catch (err) {
          render(lastUsers);
          showMessage(listMessage, err.message);
        }
      };
      for (const p of PERMISSIONS) {
        const row = document.createElement('label');
        row.className = 'perm-row';
        const text = document.createElement('span');
        text.className = 'grow';
        const name = document.createElement('strong');
        name.textContent = p.name;
        const what = document.createElement('span');
        what.className = 'slot-detail';
        what.textContent = p.what;
        text.append(name, what);
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'toggle';
        input.checked = on.has(p.key);
        input.disabled = !user.active;
        input.setAttribute('aria-label', `${p.name} for ${user.username}`);
        input.addEventListener('change', () => {
          const wanted = PERMISSIONS.map((x) => x.key).filter((k) => (k === p.key ? input.checked : on.has(k)));
          save(`${p.name} turned ${input.checked ? 'on' : 'off'}`, wanted);
        });
        switches.push(input);
        row.append(text, input);
        box.append(row);
      }
      // Turn everything on (e.g. before travelling) or off again in one tap.
      const allOn = on.size === PERMISSIONS.length;
      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'small perm-all';
      all.textContent = allOn ? 'Turn All Off' : 'Turn All On';
      all.disabled = !user.active;
      all.addEventListener('click', () => save(allOn ? 'everything turned off' : 'everything turned on',
        allOn ? [] : PERMISSIONS.map((x) => x.key)));
      switches.push(all);
      box.append(all);
      return box;
    }

    let lastUsers = [];
    function render(users) {
      lastUsers = users;
      listEl.innerHTML = '';
      for (const user of users) {
        const card = document.createElement('div');
        card.className = 'card' + (user.active ? '' : ' inactive');

        const top = document.createElement('div');
        top.className = 'row';
        const name = document.createElement('strong');
        name.textContent = user.username;
        const tag = document.createElement('span');
        tag.className = 'tag';
        // "Employee", "Owner · Inactive"
        const role = user.role.charAt(0).toUpperCase() + user.role.slice(1);
        tag.textContent = user.active ? role : `${role} · Inactive`;
        top.append(name, tag);
        card.append(top);

        if (user.username !== session.username) {
          const actions = document.createElement('div');
          actions.className = 'row';
          actions.style.marginTop = '10px';
          actions.style.justifyContent = 'flex-start';
          actions.append(
            actionButton(user.active ? 'Deactivate' : 'Reactivate', () => {
              if (user.active && !confirm(`Deactivate ${user.username}? They'll be signed out and can't sign in until reactivated.`)) return null;
              return api('setUserActive', { username: user.username, active: !user.active });
            }),
            actionButton('Reset Password', () => {
              const newPassword = prompt(`New password for ${user.username} (at least 6 characters):`);
              if (!newPassword) return null;
              return api('resetPassword', { username: user.username, newPassword })
                .then((users) => { showMessage(listMessage, `Password for ${user.username} changed. Tell them the new one.`, 'ok'); return users; });
            }),
          );
          card.append(actions);
          if (user.role !== 'owner') card.append(permissionsBox(user));
        }
        listEl.append(card);
      }
    }

    function actionButton(label, run) {
      const button = document.createElement('button');
      button.className = 'small';
      button.type = 'button';
      button.textContent = label;
      button.addEventListener('click', async () => {
        listMessage.className = 'message';
        listMessage.textContent = '';
        try {
          const users = await whileBusy(button, '…', run);
          if (users) render(users);
        } catch (err) {
          showMessage(listMessage, err.message);
        }
      });
      return button;
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const username = addForm.username.value;
        const users = await whileBusy(addForm.querySelector('button'), 'Adding…', () =>
          api('createUser', { username, password: addForm.password.value, role: 'employee' }));
        render(users);
        addForm.reset();
        showMessage(addMessage, `Added ${username.trim().toLowerCase()}.`, 'ok');
      } catch (err) {
        showMessage(addMessage, err.message);
      }
    });

    if (session) {
      api('listUsers').then(render).catch((err) => { listEl.textContent = ''; showMessage(listMessage, err.message); });
    }
  </script>
</body>
</html>
