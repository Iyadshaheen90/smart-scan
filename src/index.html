<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Smart Scan"></header>

  <a id="pendingClose" class="message banner hidden" href="close.html"></a>
  <a id="newMonthDue" class="message error banner hidden" href="month.html"></a>

  <!-- Today's status. The owner also sees the last close's totals (sales are only counted at the close). -->
  <div class="status-card" id="statusCard">
    <div class="status-top">
      <span id="todayLabel">Today</span>
      <span id="closedChip" class="chip hidden"></span>
    </div>
    <div class="employee-only hidden">
      <div class="status-title" id="employeeTitle">Ready to scan</div>
      <div class="status-note hidden" id="employeeNote"></div>
    </div>
    <div class="owner-only hidden">
      <div class="big-number fit" id="lastDollars">…</div>
      <div class="big-label" id="lastLabel">Last close</div>
      <div class="stat-grid two">
        <div class="stat"><div class="stat-value fit" id="lastTickets">…</div><div class="stat-label">Tickets sold</div></div>
        <div class="stat"><div class="stat-value fit" id="liveSlots">…</div><div class="stat-label">Slots active</div></div>
      </div>
    </div>
  </div>

  <!-- Owner -->
  <div class="owner-only hidden">
    <a class="action-main" href="close.html"><span data-icon="check"></span>Close Day</a>
    <div class="section-label">Manage</div>
    <div class="tile-grid">
      <a class="tile-card" href="slots.html"><span class="icon-box" data-icon="grid"></span>
        <span>Slots<span class="tile-stat"><span class="tile-num fit" id="liveValue">…</span><span class="tile-sub">on display</span></span></span></a>
      <a class="tile-card" href="backstock.html"><span class="icon-box" data-icon="box"></span>
        <span>Back stock &amp; shipments<span class="tile-stat"><span class="tile-num fit" id="backValue">…</span><span class="tile-sub">in the back</span></span></span></a>
      <a class="tile-card" href="month.html"><span class="icon-box" data-icon="chart"></span>
        <span>Months &amp; totals<span class="tile-stat"><span class="tile-num fit" id="monthDollars">…</span><span class="tile-sub">sold this month</span></span></span></a>
      <a class="tile-card" href="settling.html"><span class="icon-box" data-icon="settle"></span>
        <span>Settling<span class="tile-stat"><span class="tile-num fit" id="settlingCount">…</span><span class="tile-sub">live 50+ days</span></span></span></a>
    </div>
    <a class="list-card" href="users.html"><span class="icon-box" data-icon="users"></span><span class="grow">Manage employees</span><span class="chev" data-icon="chevronRight"></span></a>
  </div>

  <!-- Employee: scanning happens in Close Day, so the big button opens it. Slots is in the tab bar. -->
  <div class="employee-only hidden">
    <a class="action-main action-hero" href="close.html"><span data-icon="scan"></span>Scan tickets<span class="hint">Close Day</span></a>
  </div>

  <nav class="tabbar" data-active="home"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin();
    const isOwner = session && session.role === 'owner';
    const $ = (id) => document.getElementById(id);
    // Asked once: both the last close and the new-month reminder need it.
    const monthStatusCall = isOwner ? api('monthStatus') : null;
    if (monthStatusCall) monthStatusCall.catch(() => {});

    // "2026-09-28" -> "Mon, Sep 28"
    function dayName(label) {
      const [y, m, d] = label.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }
    const money = (n) => `$${Math.round(Number(n) || 0).toLocaleString('en-US')}`;

    // fitText (nav.js) shrinks a number that doesn't fit its box, so it always shows whole.
    function setNumber(id, text) {
      const el = $(id);
      el.textContent = text;
      fitText(el);
    }

    if (session) {
      document.querySelectorAll(isOwner ? '.owner-only' : '.employee-only').forEach((el) => el.classList.remove('hidden'));
      $('todayLabel').textContent = `Today · ${dayName(todayOnPhone())}`;
      loadStatus();
      if (isOwner) showNewMonthReminder();
    }

    function todayOnPhone() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function setChip(closed) {
      const chip = $('closedChip');
      chip.className = `chip ${closed ? 'green' : 'amber'}`;
      chip.textContent = closed ? 'Closed' : 'Not closed';
    }

    // The most recent close: this month's last closed day, or last month's if none yet this month.
    async function lastClose() {
      const status = await monthStatusCall;
      const summary = await api('monthSummary', { label: status.current });
      setNumber('monthDollars', money(summary.dollarsSold));
      if (summary.days.length) return summary.days[summary.days.length - 1];
      const earlier = (await api('listMonths')).find((m) => m.label < status.current);
      if (!earlier) return null;
      const before = await api('monthSummary', { label: earlier.label });
      return before.days.length ? before.days[before.days.length - 1] : null;
    }

    async function loadStatus() {
      const statusCall = api('closeStatus');
      if (isOwner) {
        // All at once, so home loads as fast as the slowest one. A failed number shows "—".
        api('listBackStock')
          .then((games) => setNumber('backValue', money(games.reduce((sum, g) => sum + (Number(g.valueInBack) || 0), 0))))
          .catch(() => setNumber('backValue', '—'));
        const lastCall = lastClose();
        lastCall.catch(() => setNumber('monthDollars', '—'));
        try {
          const status = await statusCall;
          $('todayLabel').textContent = `Today · ${dayName(status.today)}`;
          setChip(Boolean(status.closed));
          const live = status.slots.filter((s) => s.pack);
          setNumber('liveSlots', String(live.length));
          // Tickets left in the slots × price: what's on display as of the last close (plus packs put in since).
          setNumber('liveValue', money(live.reduce((sum, s) => sum + (Number(s.pack.remaining) || 0) * (Number(s.pack.price) || 0), 0)));
          // Packs CA Lottery settles soon or already has (Settling page); amber when there are any.
          const settling = settlingPacks(status.slots).length;
          setNumber('settlingCount', `${settling} ${settling === 1 ? 'pack' : 'packs'}`);
          $('settlingCount').classList.toggle('amber', settling > 0);
          if (status.closed) {
            showLastClose(status.closed, true);
            return;
          }
        } catch (err) {
          setNumber('liveSlots', '—'); setNumber('liveValue', '—'); setNumber('settlingCount', '—');
        }
        try {
          const day = await lastCall;
          if (day) showLastClose(day, false);
          else { setNumber('lastDollars', '$0'); $('lastLabel').textContent = 'No close yet'; setNumber('lastTickets', '0'); }
        } catch (err) {
          setNumber('lastDollars', '—'); $('lastLabel').textContent = 'Last close'; setNumber('lastTickets', '—');
        }
      } else {
        try {
          const status = await statusCall;
          $('todayLabel').textContent = `Today · ${dayName(status.today)}`;
          setChip(Boolean(status.closed));
          if (status.closed) {
            $('employeeTitle').textContent = 'Day closed';
            if (status.closed.closedAt) {
              $('employeeNote').textContent = `Submitted at ${status.closed.closedAt}${status.closed.closedBy ? ` by ${status.closed.closedBy}` : ''}`;
              $('employeeNote').classList.remove('hidden');
            }
          }
        } catch (err) {}
      }
    }

    function showLastClose(day, isToday) {
      setNumber('lastDollars', money(day.dollarsSold));
      $('lastLabel').textContent = isToday ? "Today's close" : `Last close · ${dayName(day.date)}`;
      setNumber('lastTickets', Number(day.ticketsSold).toLocaleString('en-US'));
    }

    // A close submitted with no connection is sent from here too, so it goes as soon as the app is opened online.
    async function sendSavedClose() {
      const el = $('pendingClose');
      const pending = getPendingClose();
      if (!pending) return;
      el.className = 'message banner error';
      el.textContent = `The close for ${pending.date} is saved on this phone but not sent yet. Sending…`;
      try {
        const summary = await sendPendingClose();
        el.className = 'message banner ok';
        el.textContent = `The close for ${summary.date} was sent ✓`;
        loadStatus();
      } catch (err) {
        el.textContent = canRetryClose(err)
          ? `The close for ${pending.date} is saved on this phone but not sent yet (no connection). Tap to open it.`
          : `The close for ${pending.date} wasn't saved: ${err.message} Tap to open Close Day.`;
      }
    }
    if (session) {
      sendSavedClose();
      window.addEventListener('online', sendSavedClose);
    }

    // From the 1st, until the owner starts the new month.
    async function showNewMonthReminder() {
      try {
        const status = await monthStatusCall;
        if (!status.canStart) return;
        const [year, month] = status.next.split('-').map(Number);
        const name = new Date(year, month - 1, 1).toLocaleString('en-US', { month: 'long' });
        const el = $('newMonthDue');
        el.textContent = `It's ${name} — tap here to start the new month's spreadsheet.`;
        el.classList.remove('hidden');
      } catch (e) {}
    }
  </script>
</body>
</html>
