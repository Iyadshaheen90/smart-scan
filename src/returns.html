<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Returned packs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Returned Packs" data-back="reports.html" data-back-label="Reports"></header>
  <div id="loadMessage" class="message"></div>
  <p class="sub">Packs returned to the lottery this month: partial packs from a slot (the tickets that went back) and
    sealed packs taken out of the back as returned. The list starts empty each month.</p>

  <div class="status-card saved-dim" id="totals">
    <div class="stat-grid two">
      <div class="stat"><div class="stat-value fit" id="packCount">…</div><div class="stat-label">Packs This Month</div></div>
      <div class="stat"><div class="stat-value fit" id="dollarCount">…</div><div class="stat-label">Value Returned</div></div>
    </div>
  </div>

  <div id="list" class="saved-dim"></div>

  <nav class="tabbar" data-active="reports"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin('owner');
    const $ = (id) => document.getElementById(id);
    const money = (n) => `$${Math.round(Number(n) || 0).toLocaleString('en-US')}`;

    // "2026-10-05" -> "Mon, Oct 5"
    function dayName(label) {
      const [y, m, d] = label.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function stat(value, label) {
      const box = el('div', 'stat');
      box.append(el('div', 'stat-value fit', value), el('div', 'stat-label', label));
      return box;
    }

    // A slot return is one pack and the tickets left in it; a back stock return is sealed packs of a game that day.
    function lineCard(line) {
      const card = el('div', 'card report-card');
      const top = el('div', 'row');
      top.append(el('span', 'slot-num', dayName(line.date)), el('span', 'chip green', money(line.dollars)));
      const fromSlot = line.kind === 'slot';
      const game = el('div', 'slot-detail mono report-game', fromSlot ? `Game ${line.gameNumber} · Pack ${line.packNumber}` : `Game ${line.gameNumber}`);
      // The tag sits after the slot it came from (its own line), or after the game for the back.
      const tagLine = fromSlot ? el('div', 'slot-detail report-game', `Box ${line.box} · Slot ${line.slot}`) : game;
      tagLine.append(el('span', 'chip', fromSlot ? 'From Slot' : 'From the Back'));
      const stats = el('div', fromSlot ? 'stat-grid' : 'stat-grid two');
      if (fromSlot) {
        stats.append(stat(String(line.ticketsReturned), 'Tickets Returned'), stat(money(line.price), 'Ticket Price'),
          stat(money(line.dollars), 'Total Value'));
      } else {
        stats.append(stat(String(line.packs), 'Packs Returned'), stat(money(line.price), 'Ticket Price'),
          stat(String(line.ticketsPerPack), 'Pack Size'), stat(money(line.dollars), 'Total Value'));
      }
      card.append(top, game);
      if (fromSlot) card.append(tagLine);
      card.append(stats);
      return card;
    }

    function show(data) {
      $('packCount').textContent = `${data.packs} ${data.packs === 1 ? 'Pack' : 'Packs'}`;
      $('dollarCount').textContent = money(data.dollars);
      const list = $('list');
      list.innerHTML = '';
      if (data.lines.length === 0) list.append(el('p', 'sub', 'No packs returned this month yet.'));
      data.lines.forEach((line) => list.append(lineCard(line)));
      fitNumbers();
    }

    async function load() {
      try {
        await loadSaved('returns', () => api('listReturns'), show);
        return true;
      } catch (err) {
        showLoadError($('loadMessage'), err, load);
        return false;
      }
    }
    if (session) load();
  </script>
</body>
</html>
