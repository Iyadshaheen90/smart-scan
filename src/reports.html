<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1010">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Smart Scan">
<title>Smart Scan — Reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" data-title="Reports"></header>
  <!-- Why the numbers could not load, with Try again. The rows still open their reports. -->
  <div id="loadMessage" class="message"></div>

  <!-- Every report the owner has, with this month's numbers (owner's choice 2026-10-13), as grouped lists like More
       (redesign 2026-10-29). -->
  <div class="saved-dim">
    <div class="group-block group-first">
      <h2 class="group-label">This Month</h2>
      <div class="group">
      <a class="group-row" href="month.html">
        <span class="row-icon" data-icon="chart"></span>
        <span class="row-text"><span class="row-main"><span class="row-title">Months &amp; Totals</span><span class="row-sub report-nums fit" id="monthNums">…</span></span><span class="row-chev" data-icon="chevronRight"></span></span>
      </a>
      <a class="group-row" href="shipments.html">
        <span class="row-icon" data-icon="truck"></span>
        <span class="row-text"><span class="row-main"><span class="row-title">Shipments Received</span><span class="row-sub report-nums fit" id="shipmentNums">…</span></span><span class="row-chev" data-icon="chevronRight"></span></span>
      </a>
      <a class="group-row" href="returns.html">
        <span class="row-icon" data-icon="returned"></span>
        <span class="row-text"><span class="row-main"><span class="row-title">Returned Packs</span><span class="row-sub report-nums fit" id="returnNums">…</span></span><span class="row-chev" data-icon="chevronRight"></span></span>
      </a>
      </div>
    </div>
    <!-- After a break-in: packs and unsold ticket ranges to send to the lottery (owner 2026-10-23). No number here: it's made fresh. -->
    <div class="group-block">
      <h2 class="group-label">After a Theft</h2>
      <div class="group">
      <a class="group-row" href="theft-report.html">
        <span class="row-icon danger" data-icon="theft"></span>
        <span class="row-text"><span class="row-main"><span class="row-title">Theft Report</span><span class="row-sub">Packs and Tickets to Stop</span></span><span class="row-chev" data-icon="chevronRight"></span></span>
      </a>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-active="reports"></nav>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script>
    const session = requireLogin('owner');
    const $ = (id) => document.getElementById(id);
    const money = (n) => `$${Math.round(Number(n) || 0).toLocaleString('en-US')}`;
    const packs = (n) => `${n} ${n === 1 ? 'Pack' : 'Packs'}`;

    // "This Month" is the group's label, so the numbers don't repeat it.
    function show(data) {
      $('monthNums').textContent = `${money(data.monthDollars)} Sold`;
      $('shipmentNums').textContent = `${packs(data.shipments.packs)} · ${money(data.shipments.dollars)}`;
      $('returnNums').textContent = `${packs(data.returns.packs)} · ${money(data.returns.dollars)}`;
      fitNumbers();
    }

    async function load() {
      try {
        await loadSaved('reports', () => api('reportsPage'), show);
        return true;
      } catch (err) {
        for (const id of ['monthNums', 'shipmentNums', 'returnNums']) if ($(id).textContent === '…') $(id).textContent = '—';
        showLoadError($('loadMessage'), err, load);
        return false;
      }
    }
    if (session) load();
  </script>
</body>
</html>
